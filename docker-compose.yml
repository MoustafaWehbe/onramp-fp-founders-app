services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-raise}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs the BullMQ job worker (including DOCX/PPTX->PDF rasterization) with
  # LibreOffice installed — see Dockerfile.worker. Not part of the default
  # API process. Use this service (the default with `docker compose up -d`) or
  # `npm run worker` on the host, without office-document conversion. Do not
  # run both worker processes at once, or each will compete for the same jobs.
  # Requires packages/api/.env to exist, same as the host `worker` script.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - packages/api/.env
    environment:
      # Overrides the host-oriented values from packages/api/.env — inside
      # the compose network, postgres/redis are reachable by service name.
      # The host env is development, but this image prunes development-only
      # packages such as pino-pretty and must use production logging.
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-raise}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
