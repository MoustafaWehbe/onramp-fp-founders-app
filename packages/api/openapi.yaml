  /startups/{startupId}/pipeline:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Pipeline]
      summary: List pipeline entries for a startup
      operationId: listPipelineEntries
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/PipelineStage"
        - name: roundId
          in: query
          schema:
            type: string
            format: uuid
          description: >-
            Fundraising round to show. Optional only when the startup has
            exactly one active round.
        - name: search
          in: query
          schema:
            type: string
          description: Matched against the investor's name and firm, case-insensitively.
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
          description: Only deals owned by this startup member.
        - name: attentionOnly
          in: query
          schema:
            type: boolean
          description: >-
            Only deals that would appear on the Focus tab the same
            criteria as GET /pipeline/focus.
        - name: showPassed
          in: query
          schema:
            type: boolean
            default: true
          description: >-
            When false, excludes deals in the "passed" stage. Ignored when
            `stage` is also given.
      responses:
        "200":
          description: List of pipeline entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PipelineEntry"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Pipeline]
      summary: Add an investor contact to the pipeline
      operationId: createPipelineEntry
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineEntryBody"
      responses:
        "201":
          description: Pipeline entry created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/PipelineEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Investor contact not found for this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: This investor already has a pipeline entry for this fundraising round
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

