          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Document Versions]
      summary: Upload a new version of a document
      operationId: createDocumentVersion
      description: >
        Creates a new version and sets it as the document's current version (`isCurrent = true`).
        `fileUrl` should point to the already-uploaded file in object storage.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
