  # ════════════════════════════════════════════════════════════════
  #  REVIEWER PORTAL (public token + OTP, no cookieAuth)
  # ════════════════════════════════════════════════════════════════
  /reviewer-portal/access:
    post:
      tags: [Reviewer Portal]
      summary: Request OTP for invitation token
      operationId: reviewerPortalAccess
      description: >
        Validates the token and, if valid and not expired/revoked, emails a
        fresh 6-digit OTP (10-minute TTL) to the invitation's address. Does
        NOT grant access by itself call POST /reviewer-portal/verify next.
        If the invitation has a password set, it must be supplied here and is
        checked before the OTP is sent (401 PASSWORD_REQUIRED / PASSWORD_INVALID).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [challengeId, emailHint, expiresInSeconds]
                    properties:
                      challengeId:
                        type: string
                        format: uuid
                        description: Bind this value to the OTP verification request.
                      emailHint: { type: string }
                      expiresInSeconds: { type: integer }
        "401":
          description: Password required or incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reviewer-portal/verify:
    post:
      tags: [Reviewer Portal]
      summary: Verify OTP and set reviewer session cookie
      operationId: reviewerPortalVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, challengeId, otp]
              properties:
                token:
                  type: string
                challengeId:
                  type: string
                  format: uuid
                otp:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        "200":
          description: Verified reviewer session established
          headers:
            Set-Cookie:
              schema:
                type: string
                example: reviewerSessionToken=...; HttpOnly; Path=/api/v1/reviewer-portal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReviewerPortalSession"
        "400":
          description: Code incorrect, expired, token invalid, or request validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reviewer-portal/workspace:
    get:
      tags: [Reviewer Portal]
      summary: Get invitation workspace
      operationId: reviewerPortalWorkspace
      security:
        - reviewerSessionAuth: []
      responses:
        "200":
          description: >
            Workspace. Includes requireNda/ndaText/ndaAccepted so the client
            can render the acceptance gate before it ever needs page content.

  /reviewer-portal/nda/accept:
    post:
      tags: [Reviewer Portal]
      summary: Accept the invitation's NDA
      description: >
        Idempotent. Required before any manifest/page/download endpoint will
        serve content once the invitation has requireNda set.
      operationId: reviewerPortalAcceptNda
      security:
        - reviewerSessionAuth: []
      responses:
        "204":
          description: Accepted

  /reviewer-portal/documents/{versionId}/manifest:
    get:
      tags: [Reviewer Portal]
      summary: Page manifest for a pinned document version
      description: >
        Returns page geometry plus a short-lived token for reading page images.
        Reviewers are never given the source file or its storage location the
        rendered pages are the only representation the portal exposes.
      operationId: reviewerPortalPageManifest
      security:
        - reviewerSessionAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Page manifest
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      versionId: { type: string, format: uuid }
                      documentId: { type: string, format: uuid }
                      title: { type: string }
                      versionNumber: { type: integer }
                      pageCount: { type: integer }
                      pages:
                        type: array
                        items:
                          type: object
                          properties:
                            pageNumber: { type: integer }
                            width: { type: integer }
                            height: { type: integer }
                      pageToken: { type: string }
                      pageTokenExpiresInSeconds: { type: integer }
        "404":
          description: Version is not shared with this invitation
        "409":
          description: >
            Version is not viewable RENDER_PENDING, RENDER_FAILED, or
            RENDER_UNSUPPORTED and other 409, NDA_REQUIRED when the
            invitation requires NDA acceptance that hasn't happened yet.
        "429":
          description: Secure content request budget exceeded for this reviewer session.

  /reviewer-portal/pages/{versionId}/{pageNumber}:
    get:
      tags: [Reviewer Portal]
      summary: Read one rendered page image
      description: >
        Requires both the reviewer session cookie and a page token from the
        manifest; the token's session must match the cookie's. Served
        no-store so no copy persists in the browser cache.
      operationId: reviewerPortalPageImage
      security:
        - reviewerSessionAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pageNumber
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: t
          in: query
          required: true
          description: Page token issued by the manifest endpoint.
          schema:
            type: string
        - name: kind
          in: query
          schema:
            type: string
            enum: [view, thumb]
            default: view
      responses:
        "200":
          description: WebP page image
          content:
            image/webp:
              schema:
                type: string
                format: binary
        "403":
          description: Page token invalid or expired
        "404":
          description: Page not found or version not shared
        "429":
          description: Secure content request budget exceeded for this reviewer session.
        "409":
          description: NDA_REQUIRED — invitation requires NDA acceptance that hasn't happened yet.

  /reviewer-portal/documents/{versionId}/download:
    get:
      tags: [Reviewer Portal]
      summary: Download the original file
      description: >
        The only route by which a source file leaves the server, and only when
        the founder set allowDownload on the invitation. Streamed through the
        API so the object's storage location is never exposed. When the
        invitation has watermarkEnabled on, the returned PDF is stamped with
        the reviewer's email, the link id, and the date before it is sent.
      operationId: reviewerPortalDownload
      security:
        - reviewerSessionAuth: []
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: File bytes (watermarked PDF when watermarkEnabled is on)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "403":
          description: Downloads are disabled for this invitation
        "404":
          description: Version is not shared with this invitation
        "429":
          description: Download-attempt budget exceeded for this reviewer session.
        "409":
          description: NDA_REQUIRED — invitation requires NDA acceptance that hasn't happened yet.

  /reviewer-portal/comments:
    get:
      tags: [Reviewer Portal]
      summary: List reviewer comments
      operationId: reviewerPortalListComments
      security:
        - reviewerSessionAuth: []
      parameters:
        - name: documentId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Comments
    post:
      tags: [Reviewer Portal]
      summary: Create reviewer comment
      operationId: reviewerPortalCreateComment
      security:
