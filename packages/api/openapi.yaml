  # ════════════════════════════════════════════════════════════════
  #  INVESTORS (CRM)
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/investors:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Investors]
      summary: List investor contacts for a startup
      operationId: listInvestors
      description: >
        Returns the startup's private investor contacts. Each row is joined to
        its pipeline entry (null when the contact has not been added to the
        pipeline) and to the earliest upcoming follow-up date across that
        contact's interaction logs, which is what the Investors screen renders.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search across fullName, email, ventureFirm
        - name: investorType
          in: query
          schema:
            $ref: "#/components/schemas/InvestorType"
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/PipelineStage"
          description: Filter on the joined pipeline entry's stage
        - name: engagement
          in: query
          schema:
            $ref: "#/components/schemas/Engagement"
          description: >
            Splits the directory into contacts the startup has actually
            approached and ones it has not. Omit to span both.
      responses:
        "200":
          description: List of investor contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvestorListItem"
                  meta:
                    $ref: "#/components/schemas/InvestorListMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Investors]
      summary: Create an investor contact
      operationId: createInvestor
      description: >
        Creates a contact private to this startup. Contacts are never shared
        between startups — two startups tracking the same person hold two
        independent records.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestorBody"
      responses:
        "201":
          description: Investor contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Investor"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            This startup already has a contact with that email. Contacts
            without an email never conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

