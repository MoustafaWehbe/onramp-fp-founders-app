  # ════════════════════════════════════════════════════════════════
  #  REVIEWER PORTAL (public — token + OTP, no cookieAuth)
  # ════════════════════════════════════════════════════════════════
  /reviewer-portal/access:
    post:
      tags: [Reviewer Portal]
      summary: Start access with an invitation token (triggers OTP email)
      operationId: reviewerPortalAccess
      description: >
        Validates the token and, if valid and not expired/revoked, emails a
        fresh 6-digit OTP (10-minute TTL) to the invitation's address. Does
        NOT grant access by itself — call POST /reviewer-portal/verify next.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerPortalAccessBody"
      responses:
        "200":
          description: OTP sent to the invitation email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /reviewer-portal/verify:
    post:
      tags: [Reviewer Portal]
      summary: Verify the OTP and establish a reviewer session
      operationId: reviewerPortalVerify
      description: >
        On success, sets an HttpOnly `reviewerSessionToken` cookie. All further
        Reviewer Portal calls require this cookie instead of the token/code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewerPortalVerifyBody"
      responses:
        "200":
          description: Verified — reviewer session established
          headers:
            Set-Cookie:
              schema:
                type: string
                example: reviewerSessionToken=...; HttpOnly; Path=/api/reviewer-portal
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReviewerPortalSession"
        "400":
          description: Code incorrect, expired, or token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /reviewer-portal/me:
    get:
      tags: [Reviewer Portal]
      summary: Get the current reviewer session, startup, and accessible documents
      operationId: getReviewerPortalSession
      security:
        - reviewerSessionAuth: []
      responses:
        "200":
          description: Current reviewer session details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReviewerPortalSession"
        "401":
          description: No active reviewer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reviewer-portal/documents/{documentId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Reviewer Portal]
      summary: Get a document (with its current version) the reviewer is scoped to
      operationId: getReviewerPortalDocument
      security:
        - reviewerSessionAuth: []
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Document"
        "401":
          description: No active reviewer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: This invitation does not grant access to this document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reviewer-portal/comments:
    post:
      tags: [Reviewer Comments]
      summary: Leave a comment as the authenticated reviewer
      operationId: createReviewerPortalComment
      security:
        - reviewerSessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewerCommentBody"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReviewerComment"
        "401":
          description: No active reviewer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Target is outside this invitation's document scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /reviewer-portal/comments/{commentId}:
    parameters:
      - name: commentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Reviewer Comments]
      summary: Delete a comment the reviewer authored
      operationId: deleteReviewerPortalComment
      security:
        - reviewerSessionAuth: []
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: No active reviewer session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cannot delete a comment authored by another reviewer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Comment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"