openapi: 3.1.0

info:
  title: Fundraising SaaS API
  version: 1.0.0
  description: REST API for the Fundraising SaaS application (Auth, RBAC, CRM, Financial, Documents, Reviewer Portal)

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: /api/v1
    description: Same-origin

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: Current user profile management
  - name: Startups
    description: Startup workspace management
  - name: Startup Members
    description: Team membership and invitations within a startup
  - name: Notifications
    description: Per-user notification feed, spanning every workspace they touch
  - name: Roles
    description: Custom and system roles (RBAC)
  - name: Permissions
    description: Available permission catalog (RBAC)
  - name: Investors
    description: Investor CRM records
  - name: Pipeline
    description: Investor pipeline / deal stages
  - name: Interaction Logs
    description: Logged interactions with investors
  - name: Tasks
    description: Actionable next steps on a pipeline deal
  - name: Chat
    description: >-
      Team chat channels and direct messages within a startup. Channel creators
      choose the initial members and are always included themselves.
  - name: Fundraising Rounds
    description: Fundraising round management
  - name: Commitments
    description: Investor commitments against fundraising rounds
  - name: Documents
    description: Document vault
  - name: Document Versions
    description: Versioned files within a document
  - name: Reviewer Invitations
    description: Invitations granting external reviewers access to documents
  - name: Reviewer Portal
    description: Public-facing endpoints used by external reviewers (token + OTP based, no cookieAuth)
  - name: Reviewer Comments
    description: Comments left by reviewers on documents/sections
  - name: AI Copilot
    description: Private, startup-scoped AI copilot sessions
  - name: Operations
    description: Process health and authenticated operational metrics

# ─── Reusable components ───────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login

    reviewerSessionAuth:
      type: apiKey
      in: cookie
      name: reviewerSessionToken
      description: >
        HttpOnly session cookie set after a reviewer completes token + OTP
        verification via POST /reviewer-portal/verify. Required for all
        subsequent Reviewer Portal calls.

    metricsTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Dedicated 32+ character token configured with METRICS_TOKEN

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

  schemas:
    # ── Shared / generic ─────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    ReadinessResponse:
      type: object
      required: [status, checks, timestamp]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          required: [database, redis]
          properties:
            database:
              type: string
              enum: [ok, unavailable]
            redis:
              type: string
              enum: [ok, unavailable]
        timestamp:
          type: string
          format: date-time

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    # CRM deletes answer with a bare message rather than wrapping it in `data`.
    BareMessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Investor removed

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 134
        totalPages:
          type: integer
          example: 7

    # ── Auth ──────────────────────────────────────────────────────────
    # Registration is a two-step OTP flow: /auth/register/initiate stores a
    # pending registration and emails a code, /auth/register/verify turns it
    # into a real user and signs them in. No user row exists in between.
    RegisterInitiateBody:
      type: object
      required: [first_name, last_name, email, password]
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 50
          example: Jane
        last_name:
          type: string
          minLength: 2
          maxLength: 50
          example: Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter, one lowercase letter and one number
          example: Password1

    RegisterResendBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    RegisterVerifyBody:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
          example: "482915"

    GoogleAuthBody:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Google Identity Services credential (JWT) from the browser
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjE...

    OtpChallenge:
      type: object
      properties:
        message:
          type: string
          example: Verification code sent to user@example.com
        email:
          type: string
          format: email
          example: user@example.com
        expires_in_seconds:
          type: integer
          description: Lifetime of the emailed OTP
          example: 600

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    ForgotPasswordBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordBody:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: Raw reset token from the email link (hashed server-side for lookup)
          example: 8f14e45fceea167a5a36dedd4bea2543
        new_password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter, one lowercase letter and one number
          example: NewPassword1

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: user@example.com
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/avatars/123.png
          description: >
            A served URL a self-uploaded photo (see PUT /users/me/avatar) or
            an external one (currently only Google's picture claim). Never a
            data URL; resolve which source wins server-side.
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        lastActiveStartupId:
          type: string
          format: uuid
          nullable: true
          description: >
            Which workspace to reopen on load. Null for someone who has neither
            created a startup nor accepted an invite a client should route
            those users to onboarding instead of into a 403. Only returned by
            GET /auth/me; the sign-in responses carry a narrower user object.
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100

    # ── Startups ──────────────────────────────────────────────────────
    FundingStage:
      type: string
      enum: [pre_seed, seed, series_a, series_b, series_c, growth, other]
      example: seed

    Startup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme Inc.
        description:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
          example: Fintech
        website:
          type: string
          format: uri
          nullable: true
        fundingStage:
          $ref: "#/components/schemas/FundingStage"
        createdBy:
          type: string
          format: uuid
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # A startup plus the caller's own membership in it, so a client can render
    # a workspace list and know its role in each without a request per row.
    StartupWithMembership:
      allOf:
        - $ref: "#/components/schemas/Startup"
        - type: object
          properties:
            member:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  $ref: "#/components/schemas/MemberStatus"
                role:
                  type: string
                  enum: [owner, collaborator, viewer]
                joinedAt:
                  type: string
                  format: date-time
                  nullable: true

    CreateStartupBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Acme Inc.
        description:
          type: string
        industry:
          type: string
          example: Fintech
        website:
          type: string
          format: uri
        fundingStage:
          $ref: "#/components/schemas/FundingStage"

    UpdateStartupBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
        industry:
          type: string
        website:
          type: string
          format: uri
        fundingStage:
          $ref: "#/components/schemas/FundingStage"

    # ── Startup Members ───────────────────────────────────────────────
    MemberStatus:
      type: string
      enum: [pending, active]
      description: A row is "pending" from the moment it is invited until the invite is accepted.
      example: active

    # The roles a member can hold within one startup. Roles are created per
    # startup when the workspace is created, so ids are never portable between
    # startups this is the only way to resolve one for an invite or a role change.
    StartupRoleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum: [owner, collaborator, viewer]
          example: collaborator
        description:
          type: string
          nullable: true
          example: Can edit pipeline and documents, no billing access
        isSystemRole:
          type: boolean
          example: true

    # A member row arrives in one of two shapes: someone who has accepted
    # carries `user`, while a pending invite carries `invitedEmail` and has no
    # account attached to it yet.
    StartupMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MemberStatus"
        role:
          type: string
          enum: [owner, collaborator, viewer]
          description: Role name, not id. Use GET /startups/{startupId}/roles to resolve an id.
          example: owner
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          description: Present only once the invitation has been accepted.
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            avatarUrl:
              type: string
              format: uri
              nullable: true
        invitedEmail:
          type: string
          format: email
          nullable: true
          description: Present instead of `user` while the invitation is still pending.

    # The raw membership row returned by the role-change endpoint.
    MembershipRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MemberStatus"
        invitedEmail:
          type: string
          format: email
          nullable: true
        invitedBy:
          type: string
          format: uuid
          nullable: true
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    InviteMemberBody:
      type: object
      required: [email, roleId]
      properties:
        email:
          type: string
          format: email
          example: newmember@example.com
        roleId:
          type: string
          format: uuid

    ChangeRoleBody:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
          description: Must be a role belonging to the same startup

    AcceptInviteBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Raw invite token from the email link
          example: 7c6a180b36896a0a8c02787eeafb0e4c

    # ── CRM: Investors ────────────────────────────────────────────────
    InvestorType:
      type: string
      enum: [vc, angel, family_office, accelerator, other]
      example: vc

    # Derived from activity rather than stored, so it cannot drift from what the
    # team has actually done: a contact is "engaged" once it has a pipeline
    # entry or at least one interaction log, and a "prospect" until then.
    PendingInvite:
      type: object
      description: An invitation waiting for the signed-in user.
      properties:
        id:
          type: string
          format: uuid
          description: The membership id what the accept and decline paths take
        createdAt:
          type: string
          format: date-time
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
        startup:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            industry:
              type: string
            fundingStage:
              type: string
        role:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        inviter:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: >
            Rendered specially when known. The API emits "team_invite",
            "task_assigned", "task_overdue", "task_due_today", "lead_stale"
            and "deal_no_next_step"; anything else falls back to a generic
            icon on the client. "followup_due" is legacy no new one is
            created now that tasks have superseded follow-ups, but old rows
            may still be present.
          example: team_invite
        title:
          type: string
        body:
          type: string
          nullable: true
        entityType:
          type: string
          nullable: true
          description: >
            What entityId points at, e.g. "startup_member" for a
            "team_invite" notification, "task" for any of the task ones, or
            "pipeline" for the deal reminders
        entityId:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        startup:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Engagement:
      type: string
      enum: [engaged, prospect]
      example: engaged

    InvestorListMeta:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            engagementCounts:
              type: object
              description: >
                How many contacts fall on each side of the split. Both counts
                honour the other active filters (search, investorType, stage)
                but ignore `engagement` itself, so a client can label both tabs
                from one request. `total` reflects the requested view: one of
                the two counts when `engagement` is set, their sum when not.
              properties:
                engaged:
                  type: integer
                  example: 10
                prospect:
                  type: integer
                  example: 8

    # An investor contact private to one startup. Contacts are never shared
    # between startups two startups tracking the same person hold two
    # independent records.
    Investor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        fullName:
          type: string
          example: John Smith
        email:
          type: string
          format: email
          nullable: true
          description: Optional a contact can be added before an address is known.
        ventureFirm:
          type: string
          nullable: true
          example: Acme Ventures
        investorType:
          allOf:
            - $ref: "#/components/schemas/InvestorType"
          nullable: true
        sectorFocus:
          type: string
          nullable: true
          example: Fintech, SaaS
        investmentStagePreference:
          type: string
          nullable: true
          example: Seed, Series A
        linkedinUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true
        notesCreatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the current note was first written. Cleared with the note.
        notesCreatedBy:
          type: string
          format: uuid
          nullable: true
          description: >
            User id who wrote the current note. Server-derived, never accepted
            from the client. Null for notes written before authorship was
            recorded, or when that user has since been deleted.
        notesUpdatedAt:
          type: string
          format: date-time
          nullable: true
          description: When the note was last changed. Equal to notesCreatedAt until it is edited.
        notesUpdatedBy:
          type: string
          format: uuid
          nullable: true
          description: User id who last changed the note. Server-derived.
        source:
          type: string
          nullable: true
          example: event
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # A contact joined to its pipeline entry and next follow-up the shape the
    # Investors screen renders.
    InvestorListItem:
      allOf:
        - $ref: "#/components/schemas/Investor"
        - type: object
          properties:
            pipeline:
              nullable: true
              description: Null when the contact has not been added to the pipeline.
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                roundId:
                  type: string
                  format: uuid
                  description: >
                    Which round this entry belongs to expectedAmount is in
                    that round's currency, not necessarily USD. Look up
                    GET .../fundraising-rounds for the currency.
                stage:
                  $ref: "#/components/schemas/PipelineStage"
                expectedAmount:
                  type: number
                  format: double
                  nullable: true
                probabilityPercentage:
                  type: integer
                  nullable: true
            nextFollowupDate:
              type: string
              format: date-time
              nullable: true
              description: >
                Earliest upcoming nextFollowupDate across this contact's
                interaction logs; null when none is scheduled. Legacy no new
                interaction log sets a follow-up date, so this only reflects
                data recorded before tasks superseded follow-ups.
            lastInteractionDate:
              type: string
              format: date-time
              nullable: true
              description: >
                Newest interactionDate across this contact's interaction logs,
                falling back to a log's createdAt when it carries no
                interactionDate. Null when the contact has never been logged.

    CreateInvestorBody:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          description: Optional, but must be unique within the startup when given.
        ventureFirm:
          type: string
        investorType:
          $ref: "#/components/schemas/InvestorType"
        sectorFocus:
          type: string
        investmentStagePreference:
          type: string
        linkedinUrl:
          type: string
          format: uri
          description: Must use http or https.
        notes:
          type: string
        source:
          type: string

    UpdateInvestorBody:
      type: object
      description: All fields optional; at least one required.
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
        ventureFirm:
          type: string
        investorType:
          $ref: "#/components/schemas/InvestorType"
        sectorFocus:
          type: string
        investmentStagePreference:
          type: string
        linkedinUrl:
          type: string
          format: uri
        notes:
          type: string
        source:
          type: string

    # ── CRM: Pipeline ─────────────────────────────────────────────────
    PipelineStage:
      type: string
      enum: [sourced, contacted, meeting_scheduled, due_diligence, term_sheet, committed, passed]
      example: meeting_scheduled

    PipelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        roundId:
          type: string
          format: uuid
          description: Fundraising round this opportunity belongs to.
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        investor:
          $ref: "#/components/schemas/Investor"
        stage:
          type: string
          enum: [sourced, contacted, meeting_scheduled, due_diligence, term_sheet]
          description: >-
            Initial stage only. Use the update endpoint to move to committed
            (with commitment details) or passed (with a reason).
        expectedAmount:
          type: number
          format: double
          nullable: true
          example: 250000
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          example: 60
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: The StartupMember id who owns this deal, if assigned.
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          nullable: true
        investorFitScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        isLead:
          type: boolean
          description: >-
            Whether this investor is leading the round. Not constrained to one
            per round co-leads are common.
        sortOrder:
          type: number
          format: double
          description: >-
            Manual position within its stage's column, ascending. Not
            necessarily contiguous the client places a moved card by
            averaging the sortOrder of its new neighbors.
          example: 2000
        stageChangedAt:
          type: string
          format: date-time
          description: >-
            When the deal last moved stage. Distinct from updatedAt, which also
            moves when the amount or probability is edited.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PipelineAnalytics:
      type: object
      description: >-
        Funnel and velocity derived from append-only stage history. Deals created
        before stage history existed contribute a single backfilled "joined"
        event, so they count toward reach but show no movement until next moved.
      properties:
        totalDeals:
          type: integer
        funnel:
          type: array
          items:
            type: object
            properties:
              stage:
                $ref: "#/components/schemas/PipelineStage"
              current:
                type: integer
                description: Deals sitting in this stage right now.
              currentValue:
                type: number
                format: double
              everReached:
                type: integer
                description: Deals that have ever occupied this stage.
              medianDaysInStage:
                type: number
                format: double
                nullable: true
                description: >-
                  Median length of completed visits to this stage. The current
                  occupancy is still running so it is excluded.
        conversion:
          type: array
          items:
            type: object
            properties:
              fromStage:
                $ref: "#/components/schemas/PipelineStage"
              toStage:
                $ref: "#/components/schemas/PipelineStage"
              reached:
                type: integer
              advanced:
                type: integer
                description: Of those that reached fromStage, how many went further.
              rate:
                type: number
                format: double
                nullable: true
                description: advanced / reached; null when nothing reached the stage.
        outcomes:
          type: object
          properties:
            open:
              type: integer
            committed:
              type: integer
            passed:
              type: integer
            winRate:
              type: number
              format: double
              nullable: true
              description: committed / (committed + passed); null before anything is decided.

    Priority:
      type: string
      enum: [low, medium, high]
      description: Shared by Task.priority (task urgency) and Pipeline.priority (deal importance).
      example: medium

    CreatePipelineEntryBody:
      type: object
      required: [investorId, stage]
      properties:
        roundId:
          type: string
          format: uuid
          description: >-
            Fundraising round for this opportunity. Optional only when the
            startup has exactly one active round; otherwise it is required.
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
        ownerId:
          type: string
          format: uuid
          description: A StartupMember id must belong to the same startup.
        priority:
          $ref: "#/components/schemas/Priority"
        investorFitScore:
          type: integer
          minimum: 0
          maximum: 100
        isLead:
          type: boolean
          description: >-
            Whether this investor is leading the round. Not constrained to one
            per round co-leads are common.

    UpdatePipelineEntryBody:
      type: object
      description: At least one field is required.
      properties:
        roundId:
          type: string
          format: uuid
          description: >-
            Carries the deal into another fundraising round, which must belong
            to this startup and still be draft or active. Refused with 409
            HAS_DEPENDENTS when the deal has commitments that money belongs
            to the round it was pledged to and with 409 ALREADY_IN_PIPELINE
            when the investor already holds a deal in the destination. When
            combined with a new committed-stage transition, the commitment is
            recorded against the destination round. The deal lands at the
            bottom of the matching column there.
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
          nullable: true
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        sortOrder:
          type: number
          format: double
          description: >-
            New position within its (possibly new) stage. Usually the
            midpoint of the sortOrder of the two cards it now sits between.
        ownerId:
          type: string
          format: uuid
          nullable: true
          description: A StartupMember id must belong to the same startup.
        priority:
          allOf:
            - $ref: "#/components/schemas/Priority"
          nullable: true
        investorFitScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        isLead:
          type: boolean
          description: >-
            Whether this investor is leading the round. Not constrained to one
            per round co-leads are common.
        reason:
          type: string
          maxLength: 500
          description: >-
            Required when stage is being set to "passed"; ignored for every
            other transition. Recorded on the deal's stage history, not
            overwritten on reopen, so a deal passed more than once keeps
            every reason.
        commitment:
          allOf:
            - $ref: "#/components/schemas/PipelineCommitmentDraft"
          description: >-
            Required when stage is being set to "committed" and the deal has
            no live commitment yet; ignored for every other transition. The
            transition writes the round's Commitment row in the same
            transaction, so the board and the round can never report
            different totals for the same investor. Moving a deal back out of
            committed marks its commitments withdrawn rather than deleting
            them.

    PipelineCommitmentDraft:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date-time
          nullable: true

    # ── CRM: Interaction Logs ─────────────────────────────────────────
    InteractionType:
      type: string
      enum: [call, email, meeting, note, other]
      example: meeting

    InteractionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        interactionDate:
          type: string
          format: date-time
          nullable: true
        nextFollowupDate:
          type: string
          format: date-time
          nullable: true
        followupCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null while the follow-up is outstanding. Set when it is marked done,
            or automatically when a later interaction is logged for the same
            contact that satisfies it (logged on or after the follow-up date).
        createdAt:
          type: string
          format: date-time

    PipelineStageEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        roundId:
          type: string
          format: uuid
          description: Fundraising round that owned this transition when it occurred.
        fromStage:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
          description: Null for the first event the deal being added to the pipeline.
        toStage:
          $ref: "#/components/schemas/PipelineStage"
        reason:
          type: string
          nullable: true
          description: Only present when toStage is "passed".
        changedBy:
          type: string
          format: uuid
          nullable: true
          description: Null if the member who made this change has since been removed.
        createdAt:
          type: string
          format: date-time

    PipelineFocusEntry:
      allOf:
        - $ref: "#/components/schemas/PipelineEntry"
        - type: object
          properties:
            reason:
              type: string
              enum: [overdue, today, missing, quiet, priority]
              description: >-
                Why this deal needs attention: an overdue task, a task due
                today, no open task at all, no interaction in 14+ days with
                nothing scheduled, or a high-priority deal with no other
                signal.
            daysQuiet:
              type: integer
              description: Days since the last logged interaction with this investor.
            nextTaskDueDate:
              type: string
              format: date-time
              nullable: true
              description: Due date of the soonest open task on this deal, if any.

    # ── CRM: Tasks ────────────────────────────────────────────────────
    TaskStatus:
      type: string
      enum: [open, completed]
      example: open

    Task:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        pipelineId:
          type: string
          format: uuid
          description: The pipeline deal this task belongs to.
        investor:
          type: object
          description: The investor this task belongs to through its pipeline deal.
          required: [id, fullName, ventureFirm]
          properties:
            id:
              type: string
              format: uuid
            fullName:
              type: string
            ventureFirm:
              type: string
              nullable: true
        round:
          type: object
          description: The fundraising round containing the task's deal.
          required: [id, roundName, status]
          properties:
            id:
              type: string
              format: uuid
            roundName:
              type: string
            status:
              type: string
        pipelineStage:
          type: string
          description: Current stage of the investor deal this task belongs to.
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: string
          format: date-time
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: The StartupMember id assigned to this task, if any.
        assignee:
          type: object
          nullable: true
          description: Human-readable teammate assignment details.
          required: [id, name, email]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: Set server-side when status becomes "completed"; cleared on reopen.
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTaskBody:
      type: object
      required: [pipelineId, title]
      properties:
        pipelineId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: string
          format: date-time
        assigneeId:
          type: string
          format: uuid
          description: A StartupMember id must belong to the same startup.

    UpdateTaskBody:
      type: object
      description: At least one field is required.
      properties:
        pipelineId:
          type: string
          format: uuid
          description: >
            Relinks the task to another deal in the same startup, keeping its
            history, assignee and due date. 404 PIPELINE_NOT_FOUND if the deal
            does not exist in this startup.
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        status:
          $ref: "#/components/schemas/TaskStatus"
        priority:
          $ref: "#/components/schemas/Priority"
        dueDate:
          type: string
          format: date-time
          nullable: true
        assigneeId:
          type: string
          format: uuid
          nullable: true

    Conversation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        type:
          type: string
          enum: [channel, dm]
        name:
          type: string
          nullable: true
          description: Unique within the startup among channels. Null for a DM see `counterpart`.
        topic:
          type: string
          nullable: true
        counterpart:
          type: object
          nullable: true
          description: Set only when type is "dm" the other participant, resolved for the calling viewer.
          properties:
            memberId:
              type: string
              format: uuid
            firstName:
              type: string
              nullable: true
            lastName:
              type: string
              nullable: true
            avatarUrl:
              type: string
              nullable: true
        lastReadSeq:
          type: string
          nullable: true
          description: The caller's own read pointer a decimal string, same encoding as Message.seq.
        notifyLevel:
          type: string
          enum: [all, mentions, none]
          description: The caller's own mute level for this conversation.
        unreadCount:
          type: integer
          description: Top-level messages from someone else, sent after the caller's lastReadSeq.
        lastMessageAt:
          type: string
          format: date-time
          nullable: true
        archivedAt:
          type: string
          format: date-time
          nullable: true
        createdBy:
          type: string
          format: uuid
          description: A User id.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateConversationBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
        topic:
          type: string
          maxLength: 200
        memberIds:
          type: array
          maxItems: 100
          default: []
          description: Active StartupMember ids selected for the channel. The creator is always included.
          items:
            type: string
            format: uuid

    StartDirectMessageBody:
      type: object
      required: [memberId]
      properties:
        memberId:
          type: string
          format: uuid
          description: The other active StartupMember to open (or reuse) a 1:1 DM with.

    MessageSender:
      type: object
      nullable: true
      description: Null when the sender's StartupMember row has since been removed.
      properties:
        id:
          type: string
          format: uuid
          description: A StartupMember id.
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        seq:
          type: string
          description: >-
            A decimal string, not a number BigInt has no JSON
            representation. Orders the room and is the cursor `before` reads.
          example: "42"
        senderId:
          type: string
          format: uuid
          nullable: true
        sender:
          $ref: "#/components/schemas/MessageSender"
        body:
          type: string
        parentMessageId:
          type: string
          format: uuid
          nullable: true
          description: Set for a thread reply. Threads are flat always the top-level ancestor's id.
        replyCount:
          type: integer
          description: Denormalized count of replies to this message.
        editedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/MessageReactionSummary"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/MessageAttachment"

    MessageReactionSummary:
      type: object
      description: One emoji's tally on a message.
      properties:
        emoji:
          type: string
        count:
          type: integer
        reactedByMe:
          type: boolean

    MessageAttachment:
      type: object
      description: A vault document attached to a message at send time.
      properties:
        documentId:
          type: string
          format: uuid
        title:
          type: string
        documentType:
          type: string

    SendMessageBody:
      type: object
      required: [body, clientNonce]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4000
        clientNonce:
          type: string
          format: uuid
          description: >-
            Client-generated once per send attempt and reused on retry, so a
            retried POST resolves to the original message instead of
            duplicating it.
        parentMessageId:
          type: string
          format: uuid
          description: Reply in a thread must name a message already in this conversation.
        documentIds:
          type: array
          maxItems: 10
          items:
            type: string
            format: uuid
          description: >-
            Vault documents to attach. Silently dropped if the caller lacks
            documents:read, same as an invalid @-mention.

    ToggleReactionBody:
      type: object
      required: [emoji]
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 16

    NotifyLevelBody:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: [all, mentions, none]

    ArchiveConversationBody:
      type: object
      required: [archived]
      properties:
        archived:
          type: boolean

    MentionTargetType:
      type: string
      enum: [member, investor, deal, task, round, document]
      description: >-
        What a `@[Label](type:id)` reference token inside a message body
        points at. "deal" is a Pipeline entry investor + round together.
      example: deal

    MentionableItem:
      type: object
      description: One autocomplete result from GET /chat/mentionables.
      properties:
        type:
          $ref: "#/components/schemas/MentionTargetType"
        id:
          type: string
          format: uuid
        label:
          type: string
        sublabel:
          type: string
          nullable: true

    ResolveMentionsBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [type, id]
            properties:
              type:
                $ref: "#/components/schemas/MentionTargetType"
              id:
                type: string
                format: uuid

    ResolvedMention:
      type: object
      description: >-
        One rendered reference chip's unfurl data. Fields beyond type/id/
        title/subtitle are type-specific a "deal" carries stage/isLead/
        expectedAmount (expectedAmount is null without financial:read, even
        though the deal itself is visible with pipeline:read alone); a
        "task" carries status/dueDate/priority; a "round" carries status/
        targetAmount/currency; a "document" carries documentType; a "member"
        carries avatarUrl. An id the caller cannot read, or that no longer
        exists, is simply absent from the response rather than erroring.
      properties:
        type:
          $ref: "#/components/schemas/MentionTargetType"
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
          nullable: true
        stage:
          $ref: "#/components/schemas/PipelineStage"
        isLead:
          type: boolean
        expectedAmount:
          type: number
          nullable: true
        currency:
          type: string
        ownerName:
          type: string
          nullable: true
        status:
          type: string
        dueDate:
          type: string
          format: date-time
          nullable: true
        priority:
          $ref: "#/components/schemas/Priority"
        targetAmount:
          type: number
          nullable: true
        documentType:
          type: string
        avatarUrl:
          type: string
          nullable: true
        investorType:
          $ref: "#/components/schemas/InvestorType"

    MentionBacklinkEntry:
      type: object
      description: One message referencing the requested entity the Discussion tab's unit of data.
      properties:
        mentionId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        conversationName:
          type: string
          nullable: true
          description: Null when the source conversation is a DM.
        message:
          $ref: "#/components/schemas/Message"

    ReplyThread:
      type: object
      description: Response for GET .../messages/{messageId}/replies.
      properties:
        parent:
          $ref: "#/components/schemas/Message"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Message"

    CreateInteractionLogBody:
      type: object
      required: [investorId, type, interactionDate]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
        description:
          type: string
        interactionDate:
          type: string
          format: date-time

    # At least one field is required. Nullable fields accept an explicit null
    # to clear the stored value. nextFollowupDate / followupCompletedAt are
    # absent by design: tasks superseded follow-ups, so neither can be written
    # any more, though both are still returned on logs that already carry one.
    UpdateInteractionLogBody:
      type: object
      minProperties: 1
      properties:
        pipelineId:
          type: string
          format: uuid
          nullable: true
          description: Must belong to the same investor contact as the log
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        interactionDate:
          type: string
          format: date-time
          nullable: true

    # ── Financial: Fundraising Rounds ─────────────────────────────────
    RoundStatus:
      type: string
      enum: [draft, active, closed, cancelled]
      example: active

    FundraisingRound:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        roundName:
          type: string
          example: Seed Round
        targetAmount:
          type: number
          format: double
          example: 1500000
        minimumTicketSize:
          type: number
          format: double
          nullable: true
          example: 25000
        equityOfferedPercentage:
          type: number
          format: double
          nullable: true
          example: 12.5
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/RoundStatus"
        firstCloseDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the first tranche is expected to close. Raises run rolling
            closes, so progress is judged against this before the final one.
        targetCloseDate:
          type: string
          format: date-time
          nullable: true
          description: Target date for the final close of the round.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        financialsRedacted:
          type: boolean
          description: >-
            Present and true only on the round list, when the caller holds
            pipeline:read but not financial:read. targetAmount,
            minimumTicketSize and equityOfferedPercentage are null in that
            case; every other field is the real value.

    CreateFundraisingRoundBody:
      type: object
      required: [roundName, targetAmount, currency]
      properties:
        roundName:
          type: string
          minLength: 2
          maxLength: 150
        targetAmount:
          type: number
          format: double
          minimum: 0
        minimumTicketSize:
          type: number
          format: double
          minimum: 0
        equityOfferedPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/RoundStatus"
        firstCloseDate:
          type: string
          format: date-time
        targetCloseDate:
          type: string
          format: date-time

    UpdateFundraisingRoundBody:
      type: object
      properties:
        roundName:
          type: string
          minLength: 2
          maxLength: 150
        targetAmount:
          type: number
          format: double
          minimum: 0
        minimumTicketSize:
          type: number
          format: double
          minimum: 0
        equityOfferedPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        currency:
          type: string
        status:
          $ref: "#/components/schemas/RoundStatus"
        firstCloseDate:
          type: string
          format: date-time
          nullable: true
        targetCloseDate:
          type: string
          format: date-time
          nullable: true

    # ── Financial: Commitments ────────────────────────────────────────
    CommitmentStatus:
      type: string
      description: >
        The vocabulary founders and investors use for a raise. "soft_circled"
        is a verbal yes with nothing signed and must never be counted as
        raised; "hard_circled" means the docs are signed and the money is
        legally committed; "wired" means it is in the bank. Only hard_circled
        and wired count toward a round's target.
      enum: [soft_circled, hard_circled, wired, withdrawn]
      example: soft_circled

    Commitment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        investor:
          $ref: "#/components/schemas/Investor"
        pipelineId:
          type: string
          format: uuid
        roundId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          example: 50000
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommitmentBody:
      type: object
      required: [investorId, pipelineId, roundId, amount]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
        roundId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date-time

    UpdateCommitmentBody:
      type: object
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date-time

    CommitmentStatusEvent:
      type: object
      description: >
        One real transition a commitment made from one confidence status to
        another. The first event on any commitment has fromStatus null that
        is the commitment being recorded, not a change. Ordered oldest first;
        this is what a funding-over-time chart should be built from, since
        commitments.createdAt only says when the row was typed in, not when
        the money actually became soft-circled, signed, or wired.
      properties:
        id:
          type: string
          format: uuid
        commitmentId:
          type: string
          format: uuid
        investorName:
          type: string
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/CommitmentStatus"
          nullable: true
        toStatus:
          $ref: "#/components/schemas/CommitmentStatus"
        amount:
          type: number
          format: double
          nullable: true
          description: The commitment's current amount not necessarily what it was at this specific transition, since amount can be edited independently of status.
        createdAt:
          type: string
          format: date-time

    AtRiskCommitment:
      type: object
      description: A commitment whose expected close date has passed without it reaching wired or withdrawn.
      properties:
        id:
          type: string
          format: uuid
        investorName:
          type: string
        amount:
          type: number
          format: double
          nullable: true
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date-time
        daysOverdue:
          type: integer
          example: 12

    RoundMetrics:
      type: object
      description: >
        The numbers a round's health is judged by, computed server-side so
        Dashboard, Fundraising and anywhere else showing "this round's
        numbers" read the same values. Every commitment amount is in the
        round's own currency, never assumed to be USD.
      properties:
        currency:
          type: string
          example: USD
        targetAmount:
          type: number
          format: double
        wired:
          type: number
          format: double
          description: Sum of commitments with status "wired" money actually in the bank.
        hardCircled:
          type: number
          format: double
          description: Sum of commitments with status "hard_circled" signed, not yet wired.
        softCircled:
          type: number
          format: double
          description: Sum of commitments with status "soft_circled" verbal only, never counted toward the target.
        bankableRaised:
          type: number
          format: double
          description: wired + hardCircled the money a founder may legitimately call raised.
        remainingGap:
          type: number
          format: double
          description: max(0, targetAmount - bankableRaised).
        percentToTarget:
          type: integer
          description: round(bankableRaised / targetAmount * 100), capped at 100; 0 when targetAmount is 0.
        weightedPipeline:
          type: number
          format: double
          description: >
            Sum of expectedAmount × probabilityPercentage / 100 across this
            round's live pipeline deals everything except stage "committed"
            (already counted exactly via its commitment, not an estimate) and
            "passed" (contributes nothing).
        daysToClose:
          type: integer
          nullable: true
          description: >
            Days until targetCloseDate (falling back to firstCloseDate when
            unset); negative once that date has passed. Null when the round
            has neither date set.
        atRiskCommitments:
          type: array
          items:
            $ref: "#/components/schemas/AtRiskCommitment"

    # ── Documents ───────────────────────────────────────────────────
    DocumentType:
      type: string
      enum: [pitch_deck, financial_model, cap_table, term_sheet, data_room, other]
      example: pitch_deck

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        title:
          type: string
          example: Series A Pitch Deck
        documentType:
          $ref: "#/components/schemas/DocumentType"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        currentVersion:
          allOf:
            - $ref: "#/components/schemas/DocumentVersion"
          nullable: true
        aiScore:
          type: integer
          nullable: true

    CreateDocumentUploadSessionBody:
      type: object
      required: [title, documentType, originalFilename, mimeType, fileSize]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - text/plain
        fileSize:
          type: integer
          minimum: 1
          maximum: 20971520
        summary:
          type: string
          maxLength: 500

    CreateDocumentBody:
      type: object
      required: [title, documentType]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"

    UpdateDocumentBody:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          example: 3
        isCurrent:
          type: boolean
        fileSize:
          type: integer
          description: File size in bytes
          example: 2485760
          nullable: true
        mimeType:
          type: string
        originalFilename:
          type: string
        processingStatus:
          type: string
          enum: [pending_upload, processing, ready, failed]
        processingError:
          type: string
          nullable: true
        renderStatus:
          type: string
          enum: [pending, rendering, ready, unsupported, failed]
        renderError:
          type: string
          nullable: true
        pageCount:
          type: integer
          nullable: true
        reviewerShareStatus:
          type: string
          enum: [processing, ready, unsupported, failed]
          description: Authoritative capability state for sharing this version in the secure reviewer portal.
        summary:
          type: string
          nullable: true
          description: Description of what changed in this version
        uploadedBy:
          type: string
          format: uuid
        uploaderName:
          type: string
          nullable: true
          description: Joined only where the caller actually needs to attribute a version to someone (currently GET .../documents/{documentId}); null on the create/version-upload/confirm responses, where the uploader is trivially the caller.
        createdAt:
          type: string
          format: date-time
        hasFile:
          type: boolean

    CreateDocumentVersionUploadBody:
      type: object
      required: [originalFilename, mimeType, fileSize]
      properties:
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          enum:
            - application/pdf
            - application/vnd.openxmlformats-officedocument.wordprocessingml.document
            - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
            - text/plain
        fileSize:
          type: integer
          minimum: 1
          maximum: 20971520
        summary:
          type: string
          maxLength: 500

    CreateDocumentVersionBody:
      type: object
      required: [fileUrl, fileSize]
      properties:
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          minimum: 0
        summary:
          type: string

    # ── Reviewer ──────────────────────────────────────────────────────
    ReviewerInvitationStatus:
      type: string
      enum: [pending, opened, in_review, completed, expired, revoked]
      example: pending

    ReviewerInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        reviewerName:
          type: string
          nullable: true
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ReviewerInvitationStatus"
        allowDownload:
          type: boolean
        watermarkEnabled:
          type: boolean
        allowPrint:
          type: boolean
        screenshotGuard:
          type: boolean
        requireNda:
          type: boolean
        hasPassword:
          type: boolean
        allowedEmailDomains:
          type: array
          items:
            type: string
        personalMessage:
          type: string
          nullable: true
        deliveryStatus:
          type: string
          enum: [unknown, queued, sent, failed]
        deliveryAttempts:
          type: integer
        deliveryLastAttemptAt:
          type: string
          format: date-time
          nullable: true
        deliverySentAt:
          type: string
          format: date-time
          nullable: true
        deliveryFailedAt:
          type: string
          format: date-time
          nullable: true
        deliveryError:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastActivityAt:
          type: string
          format: date-time
          nullable: true
        documentCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CreateReviewerInvitationBody:
      type: object
      required: [email, documentVersionIds]
      properties:
        email:
          type: string
          format: email
        reviewerName:
          type: string
        startupInvestorId:
          type: string
          format: uuid
        allowDownload:
          type: boolean
        watermarkEnabled:
          type: boolean
          default: true
        allowPrint:
          type: boolean
          default: false
        screenshotGuard:
          type: boolean
          default: true
        requireNda:
          type: boolean
          default: false
          description: Require acceptance of the predefined Raise confidentiality agreement before documents open.
        password:
          type: string
          minLength: 6
          maxLength: 100
          description: Optional second factor checked before an OTP is sent.
        allowedEmailDomains:
          type: array
          maxItems: 10
          items:
            type: string
          description: Reject creating the invitation unless the email's domain is in this list.
        personalMessage:
          type: string
        expiresInDays:
          type: integer
          minimum: 1
          maximum: 90
          default: 14
        documentVersionIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
            format: uuid

    UpdateReviewerInvitationBody:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [revoked]
          description: Owners may only transition status to "revoked" via this endpoint

    # ── Reviewer Portal (public, token + OTP) ──────────────────────────
    ReviewerPortalAccessBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Raw invitation token from the emailed link
          example: 3a7bd3e2360a3d29eea436fcfb7e44542f4e4cd2e3e4a3c

    ReviewerPortalVerifyBody:
      type: object
      required: [token, code]
      properties:
        token:
          type: string
          example: 3a7bd3e2360a3d29eea436fcfb7e44542f4e4cd2e3e4a3c
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit OTP code emailed to the invitation address
          example: "482913"

    ReviewerPortalSession:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/ReviewerInvitation"
        startup:
          $ref: "#/components/schemas/Startup"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"

    # ── Reviewer Comments ─────────────────────────────────────────────
    ReviewerComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
          nullable: true
        documentVersionId:
          type: string
          format: uuid
          nullable: true
        chunkId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          format: uuid
          nullable: true

    ReviewerActivity:
      type: object
      required: [id, type, occurredAt, document, pageNumber, details]
      properties:
        id: { type: string }
        type:
          type: string
          enum:
            - invitation_created
            - invitation_sent
            - access_verified
            - visit_started
            - page_viewed
            - comment_added
            - security_event
            - review_completed
            - invitation_revoked
        occurredAt: { type: string, format: date-time }
        document:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            versionId: { type: string, format: uuid }
        pageNumber: { type: integer, nullable: true }
        details:
          type: object
          additionalProperties: true

    CreateReviewerCommentBody:
      type: object
      required: [commentText]
      properties:
        documentId:
          type: string
          format: uuid
          nullable: true
        documentVersionId:
          type: string
          format: uuid
          nullable: true
        chunkId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
          minLength: 1

# ─── Paths ─────────────────────────────────────────────────────────────────────
    AiSession:
      type: object
      required: [id, startupId, contextMode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        startupId: { type: string, format: uuid }
        title: { type: string, nullable: true }
        contextMode: { type: string, enum: [selected, workspace] }
        roundId: { type: string, format: uuid, nullable: true }
        lastMessageAt: { type: string, format: date-time, nullable: true }
        archivedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        documents:
          type: array
          items:
            type: object
            properties:
              documentId: { type: string, format: uuid }
              documentVersionId: { type: string, format: uuid }
              title: { type: string }
              versionNumber: { type: integer }
              processingStatus: { type: string }
        persona:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            name: { type: string, nullable: true }
            description: { type: string, nullable: true }
    CreateAiSessionBody:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        contextMode: { type: string, enum: [selected, workspace], default: selected }
        roundId: { type: string, format: uuid }
        documentVersionIds:
          type: array
          maxItems: 10
          items: { type: string, format: uuid }
    UpdateAiSessionBody:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        archived: { type: boolean }
        personaId: { type: string, format: uuid, nullable: true }
    CreateAiMessageBody:
      type: object
      required: [content, clientRequestId]
      properties:
        content: { type: string, minLength: 1, maxLength: 12000 }
        clientRequestId:
          type: string
          format: uuid
          description: Reuse this value when retrying a POST to prevent a duplicate model run.
    AiCitation:
      type: object
      required: [id, sourceType, sourceId, label, sortOrder]
      properties:
        id: { type: string, format: uuid }
        sourceType: { type: string }
        sourceId: { type: string }
        label: { type: string }
        excerpt: { type: string, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        sortOrder: { type: integer }
    AiChatMessage:
      type: object
      required: [id, role, content, status, createdAt, citations, artifacts]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        status: { type: string, enum: [pending, streaming, completed, failed, cancelled] }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        citations:
          type: array
          items: { $ref: "#/components/schemas/AiCitation" }
        artifacts:
          type: array
          items: { $ref: "#/components/schemas/AiArtifact" }
    AiArtifact:
      type: object
      required: [id, type, status, data, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [action_proposal.v1] }
        title: { type: string, nullable: true }
        status: { type: string, enum: [building, ready, failed] }
        data: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    CreateAiAnalysisBody:
      type: object
      required: [documentVersionId]
      properties:
        documentVersionId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
    AiAnalysis:
      type: object
      required: [id, startupId, documentVersionId, status, rubricVersion, queuedAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        startupId: { type: string, format: uuid }
        documentVersionId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [queued, processing, completed, failed, cancelled] }
        overallScore: { type: integer, nullable: true }
        narrativeScore: { type: integer, nullable: true }
        marketValidationScore: { type: integer, nullable: true }
        financialScore: { type: integer, nullable: true }
        confidenceScore: { type: integer, nullable: true }
        summaryReport: { type: string, nullable: true }
        result: { type: object, nullable: true, additionalProperties: true }
        rubricVersion: { type: string }
        model: { type: string, nullable: true }
        errorCode: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

paths:
  /health:
    get:
      tags: [Operations]
      summary: Check whether the API process is alive
      operationId: getHealth
      servers:
        - url: http://localhost:3000
          description: Local development
        - url: /
          description: Same-origin
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  timestamp:
                    type: string
                    format: date-time

  /ready:
    get:
      tags: [Operations]
      summary: Check whether the API can serve dependency-backed requests
      operationId: getReadiness
      servers:
        - url: http://localhost:3000
          description: Local development
        - url: /
          description: Same-origin
      responses:
        "200":
          description: PostgreSQL and Redis are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /metrics:
    get:
      tags: [Operations]
      summary: Export Prometheus-compatible operational metrics
      operationId: getMetrics
      security:
        - metricsTokenAuth: []
      servers:
        - url: http://localhost:3000
          description: Local development
        - url: /
          description: Same-origin
      responses:
        "200":
          description: Metrics snapshot; labels never contain reviewer or startup identifiers
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Missing or invalid metrics bearer token
        "404":
          description: Metrics are disabled

  # ════════════════════════════════════════════════════════════════
  #  AUTH
  # ════════════════════════════════════════════════════════════════
  /auth/register/initiate:
    post:
      tags: [Auth]
      summary: Start registration and email a verification code
      operationId: registerInitiate
      description: >
        Stores a pending registration and emails a 6-digit OTP. No user account
        exists until POST /auth/register/verify succeeds. Responds 200 with the
        same body whether or not the email is already taken, so the endpoint
        cannot be used to enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInitiateBody"
      responses:
        "200":
          description: Verification code sent (or silently skipped for an existing account)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OtpChallenge"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/resend:
    post:
      tags: [Auth]
      summary: Resend the registration verification code
      operationId: registerResend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterResendBody"
      responses:
        "200":
          description: A fresh code was sent if a pending registration exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OtpChallenge"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/verify:
    post:
      tags: [Auth]
      summary: Verify the code, create the account and sign in
      operationId: registerVerify
      description: >
        On success the pending registration becomes a real user, auth cookies
        are set, and any unexpired invitations addressed to that email are
        claimed automatically so an invited person lands in their workspace
        without visiting the invite link again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyBody"
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api/v1
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in or register with a Google ID token
      operationId: googleAuth
      description: >
        Verifies the Google credential, then links or creates the account and
        sets auth cookies. Returns 201 for a newly created user and 200 for an
        existing one. Like OTP registration, this claims any pending invitations
        for the verified email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthBody"
      responses:
        "200":
          description: Existing user signed in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api/v1
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      is_new_user:
                        type: boolean
                        example: false
        "201":
          description: New user created and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      is_new_user:
                        type: boolean
                        example: true
        "401":
          description: Invalid Google token, or the Google email is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive auth cookies
      operationId: login
      description: >
        On success, sets two HttpOnly cookies: `accessToken` (15 min) and
        `refreshToken` (7 days). Include `credentials: "include"` in fetch calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: Reads the `refreshToken` cookie and issues new auth cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear auth cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      operationId: forgotPassword
      description: >
        Always returns 200 regardless of whether the email exists, to avoid
        leaking which addresses are registered. If found, an email is sent
        with a single-use token (10-minute family rotation tracked server-side).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset email sent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token from the reset email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  USERS (current user profile)
  # ════════════════════════════════════════════════════════════════
  /users/me:
    patch:
      tags: [Users]
      summary: Update the current user's profile
      operationId: updateMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /users/me/avatar:
    put:
      tags: [Users]
      summary: Upload or replace the current user's profile photo
      description: >
        Raw image bytes, not JSON or multipart — the client resizes to 512px
        and encodes as WebP (falling back to PNG on browsers whose canvas
        cannot encode WebP) before sending. Server-mediated to a storage
        bucket rather than a signed direct-upload URL, since avatars are
        small and non-sensitive, unlike documents. Replaces and deletes any
        previous photo.
      operationId: uploadAvatar
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          image/webp:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Avatar updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "400":
          description: Unsupported image type or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Users]
      summary: Remove the current user's profile photo
      description: Clears both a self-uploaded photo and any external one (e.g. Google's picture claim); the user falls back to initials.
      operationId: removeAvatar
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Avatar removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  STARTUPS
  # ════════════════════════════════════════════════════════════════
  /startups:
    get:
      tags: [Startups]
      summary: List the workspaces the current user can open
      operationId: listStartups
      description: >
        Scoped by the caller's active memberships, so this is the one startup
        endpoint that takes no startupId it is what a client calls before it
        knows which workspace it is in. Pending invitations are excluded, since
        they are not openable. Not paginated: a user belongs to a handful of
        workspaces. An empty list means the user has no workspace yet and should
        be sent to onboarding it is not a permission failure.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspaces the caller is an active member of, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      startups:
                        type: array
                        items:
                          $ref: "#/components/schemas/StartupWithMembership"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Startups]
      summary: Create a new startup
      operationId: createStartup
      description: The creator automatically becomes a member with the default "Owner" system role.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStartupBody"
      responses:
        "201":
          description: Startup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startups]
      summary: Get a startup by ID
      operationId: getStartup
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Startup details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Startups]
      summary: Update a startup
      operationId: updateStartup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStartupBody"
      responses:
        "200":
          description: Startup updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Startups]
      summary: Delete a startup
      operationId: deleteStartup
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Startup deleted (no body)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  STARTUP MEMBERS
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/roles:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startup Members]
      summary: List the roles assignable within a startup
      operationId: listStartupRoles
      description: >
        Roles are created per startup, so their ids are not portable between
        workspaces. This is the only way to resolve the `roleId` required by the
        invite and role-change endpoints. Ordered most privileged first.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Roles belonging to this startup
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roles:
                        type: array
                        items:
                          $ref: "#/components/schemas/StartupRoleSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing team:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/members:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startup Members]
      summary: List members of a startup
      operationId: listStartupMembers
      description: >
        Returns accepted members and pending invitations in one list, oldest
        first. The response is not paginated. The caller's own row is included,
        which is how a client determines its own role.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Members and pending invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          $ref: "#/components/schemas/StartupMember"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing team:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/invites:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Startup Members]
      summary: Invite a person to join the startup
      operationId: inviteStartupMember
      description: >
        Creates a member row with status "pending" and emails a time-limited
        invite link (valid for 7 days). `userId` stays null until the invite is
        accepted. Assigning the owner role requires the caller to be an owner.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberBody"
      responses:
        "201":
          description: >
            Invitation created. `emailQueued` is false when the member row was
            committed but the notification email could not be queued (e.g. a
            Redis outage) the caller should tell the inviter to follow up with
            the person directly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  emailQueued:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:create, or OWNER_ONLY when assigning the owner role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ROLE_NOT_FOUND the role does not belong to this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_MEMBER already a member or already invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/invites/{memberId}/resend:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Startup Members]
      summary: Reissue and resend a pending invitation
      operationId: resendStartupInvite
      description: >
        Mints a new token and restarts the 7-day clock, then emails the link
        again. Only the hash of the previous token is stored, so the old link
        cannot be re-sent it is replaced, and any copy already sitting in an
        inbox stops working.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: >
            A new link was issued. `emailQueued` is false when the token was
            rotated but the mail could not be queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  emailQueued:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_ACCEPTED there is nothing left to resend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/activate:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Startups]
      summary: Remember this workspace as the caller's active one
      operationId: activateStartup
      description: >
        Sets lastActiveStartupId for the signed-in user so the choice of
        workspace follows them to another device instead of living only in one
        browser's storage. Any active member may call it, whatever their role.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Recorded (no body)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member of this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/members/{memberId}/role:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Startup Members]
      summary: Change a member's role
      operationId: changeStartupMemberRole
      description: >
        Works on pending invitations as well as accepted members. The last
        active owner cannot be demoted, and only an owner may grant the owner
        role.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MembershipRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:update, or OWNER_ONLY when granting the owner role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found, or ROLE_NOT_FOUND in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: LAST_OWNER cannot change the role of the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/members/{memberId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Startup Members]
      summary: Remove a member, or revoke a pending invitation
      operationId: removeStartupMember
      description: >
        Callers may remove themselves, which is how leaving a workspace works.
        The last active owner cannot be removed.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Member removed (no body)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: LAST_OWNER cannot remove the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/mine:
    get:
      tags: [Startup Members]
      summary: Invitations waiting for the signed-in user
      operationId: listMyInvites
      description: >
        Pending, unexpired invitations addressed to the caller's own email.
        Someone who was already signed in when the invitation arrived accepts it
        from inside the app; the emailed token is only one of two routes in.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The caller's pending invitations, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingInvite"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/mine/{memberId}/accept:
    post:
      tags: [Startup Members]
      summary: Accept an invitation addressed to you
      operationId: acceptMyInvite
      description: >
        Accepts by membership id rather than by token the session already
        proves who the caller is. An invitation addressed to anybody else is
        reported as 404, not 403: the caller has no business learning it exists.
      security:
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The membership, now active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MembershipRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND no pending invitation for this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_ACCEPTED the invitation is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: TOKEN_EXPIRED the invitation is older than 7 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/mine/{memberId}/decline:
    post:
      tags: [Startup Members]
      summary: Decline an invitation addressed to you
      operationId: declineMyInvite
      description: >
        Removes the pending membership. An owner may send a fresh invitation
        afterwards.
      security:
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation declined
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND no pending invitation for this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  NOTIFICATIONS
  # ════════════════════════════════════════════════════════════════
  /notifications:
    get:
      tags: [Notifications]
      summary: List the signed-in user's notifications
      operationId: listNotifications
      description: >
        Notifications belong to a user, not to a workspace someone who has
        been invited but has not joined anything yet still sees the invitation
        on their otherwise empty dashboard. There is therefore no startupId in
        the path and no membership check.
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: unread
          in: query
          description: Restrict to unread notifications.
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  meta:
                    type: object
                    properties:
                      unreadCount:
                        type: integer
                        description: Total unread, independent of limit and filter
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Live notification stream (server-sent events)
      operationId: streamNotifications
      description: >
        A long-lived text/event-stream carrying the caller's notification
        events. Chosen over WebSockets because the traffic is one-directional:
        it rides ordinary HTTP, so cookie auth applies unchanged and the browser
        reconnects on its own (the stream advertises `retry: 5000`).


        Events are signals, not data each one means "refetch". A comment
        heartbeat is sent every 25s to stop idle proxies hanging up, and the
        response sets `X-Accel-Buffering: no` because nginx would otherwise
        buffer the stream indefinitely.


        Event names: `ready` once on connect; `notification.created` when one
        arrives; `notifications.changed` when the unread state moved elsewhere
        (another tab marking read, or an invitation being accepted).


        Fan-out is in-process today, so this only reaches clients connected to
        the same API instance. Running more than one requires a shared bus.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 5000

                event: ready
                data: {}

                event: notification.created
                data: {"type":"notification.created","notification":{"id":"…","type":"team_invite","title":"You've been invited to Acme Corp","body":"Join as collaborator to start collaborating."}}

                : ping

        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification read
      operationId: markAllNotificationsRead
      security:
        - cookieAuth: []
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification read
      operationId: markNotificationRead
      security:
        - cookieAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked read
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND no such notification for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/accept:
    post:
      tags: [Startup Members]
      summary: Accept a startup membership invitation
      operationId: acceptStartupInvite
      description: >
        Reachable signed-out, but the membership is only ever activated for a
        signed-in user whose account email matches the invited address. Holding
        the link is not enough: an anonymous caller, or one signed in as anybody
        else, gets a 202 or 403 and the invitation is left untouched.


        Accepting is idempotent the invited member may open the link again
        (including after registration already claimed the invite) and gets 200
        with the same membership rather than an error.
      security:
        - cookieAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteBody"
      responses:
        "200":
          description: >
            The membership was activated for the signed-in user, or already
            belonged to them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MembershipRecord"
        "202":
          description: >
            Nobody is signed in as the invited person yet, so nothing was
            changed. `requiresRegistration` means no account exists for the
            invited address registering with it claims the invite
            automatically. `requiresLogin` means the account exists and only
            needs to sign in.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [requiresRegistration, email]
                    properties:
                      requiresRegistration:
                        type: boolean
                        example: true
                      email:
                        type: string
                        format: email
                        description: The invited address the account must be created with it
                  - type: object
                    required: [requiresLogin, email]
                    properties:
                      requiresLogin:
                        type: boolean
                        example: true
                      email:
                        type: string
                        format: email
                        description: The invited address sign in as this account to accept
        "403":
          description: >
            EMAIL_MISMATCH signed in as someone other than the invited person.
            The invitation stays pending.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      invitedEmail:
                        type: string
                        format: email
                      signedInAs:
                        type: string
                        format: email
        "404":
          description: INVALID_TOKEN no invitation matches this token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            ALREADY_ACCEPTED this invitation was already used by the person it
            was sent to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: TOKEN_EXPIRED the invitation is older than 7 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  INVESTORS (CRM)
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/investors:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Investors]
      summary: List investor contacts for a startup
      operationId: listInvestors
      description: >
        Returns the startup's private investor contacts. Each row is joined to
        a pipeline entry (null when the contact has not been added to the
        pipeline). Supplying roundId joins only the entry in that fundraising
        round, which is useful when choosing contacts to add to a board.
        Set pipelineOnly=true to exclude contacts without a matching deal.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search across fullName, email, ventureFirm
        - name: investorType
          in: query
          schema:
            $ref: "#/components/schemas/InvestorType"
        - name: stage
          in: query
          schema:
            $ref: "#/components/schemas/PipelineStage"
          description: Filter on the joined pipeline entry's stage
        - name: roundId
          in: query
          schema:
            type: string
            format: uuid
          description: Return the pipeline entry for this fundraising round only.
        - name: ownerId
          in: query
          schema:
            type: string
            format: uuid
          description: Return investors whose matching pipeline deal is owned by this member.
        - name: pipelineOnly
          in: query
          schema:
            type: boolean
          description: Exclude contacts without a pipeline deal matching the round, stage, and owner filters.
        - name: engagement
          in: query
          schema:
            $ref: "#/components/schemas/Engagement"
          description: >
            Splits the directory into contacts the startup has actually
            approached and ones it has not. Omit to span both.
      responses:
        "200":
          description: List of investor contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InvestorListItem"
                  meta:
                    $ref: "#/components/schemas/InvestorListMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Investors]
      summary: Create an investor contact
      operationId: createInvestor
      description: >
        Creates a contact private to this startup. Contacts are never shared
        between startups two startups tracking the same person hold two
        independent records.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvestorBody"
      responses:
        "201":
          description: Investor contact created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Investor"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            This startup already has a contact with that email. Contacts
            without an email never conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/investors/{investorId}:
    parameters:
      - name: startupId
        in: path
