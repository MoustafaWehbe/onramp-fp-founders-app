          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Sessions owned by the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AiSession" }
        "403": { description: Missing ai_reports:read }
    post:
      tags: [AI Copilot]
      summary: Create a private AI session
      operationId: createAiSession
      security: [{ cookieAuth: [] }]
      parameters:
        - name: startupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAiSessionBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiSession" }
        "403": { description: Missing AI or underlying context permission }
        "400": { description: Invalid or unavailable document version }

  /startups/{startupId}/ai/sessions/{sessionId}:
    get:
      tags: [AI Copilot]
      summary: Get one private AI session
      operationId: getAiSession
      security: [{ cookieAuth: [] }]
      parameters:
        - name: startupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/AiSession" }
        "404": { description: Session is absent or not owned by the caller }

  /startups/{startupId}/ai/sessions/{sessionId}/messages:
    get:
      tags: [AI Copilot]
      summary: List persisted messages in a private AI session
      operationId: listAiMessages
      security: [{ cookieAuth: [] }]
      parameters:
        - name: startupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Messages owned by the authenticated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AiChatMessage" }
        "403": { description: Missing AI or pinned-document permission }
        "404": { description: Session is absent or not owned by the caller }
    post:
      tags: [AI Copilot]
      summary: Persist a user message and pending assistant response
      operationId: createAiMessage
      security: [{ cookieAuth: [] }]
      parameters:
        - name: startupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAiMessageBody" }
      responses:
        "202":
          description: Assistant response is pending; open streamUrl to begin or reconnect.
          "403": { description: Missing AI or protected-context permission }

  /startups/{startupId}/ai/sessions/{sessionId}/messages/{messageId}/stream:
    get:
      tags: [AI Copilot]
      summary: Stream a pending assistant response using server-sent events
      operationId: streamAiMessage
      security: [{ cookieAuth: [] }]
      parameters:
        - name: startupId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Last-Event-ID
          in: header
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Application-owned SSE events, each carrying version, sessionId, messageId, sequence, timestamp, and payload.
          content:
            text/event-stream:
              schema: { type: string }
        "404": { description: Session or assistant message is absent or not owned by the caller }

  /startups/{startupId}/ai/sessions/{sessionId}/messages/{messageId}/cancel:
