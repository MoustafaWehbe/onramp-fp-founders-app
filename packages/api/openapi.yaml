          required: true
          schema: { type: string, format: uuid }
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Cancelled }
        "409": { description: Assistant message is already terminal }
    patch:
