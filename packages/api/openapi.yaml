openapi: 3.1.0

info:
  title: Fundraising SaaS API
  version: 1.0.0
  description: REST API for the Fundraising SaaS application (Auth, RBAC, CRM, Financial, Documents, Reviewer Portal)

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: /api/v1
    description: Same-origin

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: Current user profile management
  - name: Startups
    description: Startup workspace management
  - name: Startup Members
    description: Team membership and invitations within a startup
  - name: Notifications
    description: Per-user notification feed, spanning every workspace they touch
  - name: Roles
    description: Custom and system roles (RBAC)
  - name: Permissions
    description: Available permission catalog (RBAC)
  - name: Investors
    description: Investor CRM records
  - name: Pipeline
    description: Investor pipeline / deal stages
  - name: Interaction Logs
    description: Logged interactions with investors
  - name: Fundraising Rounds
    description: Fundraising round management
  - name: Commitments
    description: Investor commitments against fundraising rounds
  - name: Documents
    description: Document vault
  - name: Document Versions
    description: Versioned files within a document
  - name: Reviewer Invitations
    description: Invitations granting external reviewers access to documents
  - name: Reviewer Portal
    description: Public-facing endpoints used by external reviewers (token + OTP based, no cookieAuth)
  - name: Reviewer Comments
    description: Comments left by reviewers on documents/sections

# ─── Reusable components ───────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login

    reviewerSessionAuth:
      type: apiKey
      in: cookie
      name: reviewerSessionToken
      description: >
        HttpOnly session cookie set after a reviewer completes token + OTP
        verification via POST /reviewer-portal/verify. Required for all
        subsequent Reviewer Portal calls.

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

  schemas:
    # ── Shared / generic ─────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    # CRM deletes answer with a bare message rather than wrapping it in `data`.
    BareMessageResponse:
      type: object
      properties:
        message:
          type: string
          example: Investor removed

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 134
        totalPages:
          type: integer
          example: 7

    # ── Auth ──────────────────────────────────────────────────────────
    # Registration is a two-step OTP flow: /auth/register/initiate stores a
    # pending registration and emails a code, /auth/register/verify turns it
    # into a real user and signs them in. No user row exists in between.
    RegisterInitiateBody:
      type: object
      required: [first_name, last_name, email, password]
      properties:
        first_name:
          type: string
          minLength: 2
          maxLength: 50
          example: Jane
        last_name:
          type: string
          minLength: 2
          maxLength: 50
          example: Doe
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter, one lowercase letter and one number
          example: Password1

    RegisterResendBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    RegisterVerifyBody:
      type: object
      required: [email, otp]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        otp:
          type: string
          minLength: 6
          maxLength: 6
          pattern: "^[0-9]{6}$"
          example: "482915"

    GoogleAuthBody:
      type: object
      required: [id_token]
      properties:
        id_token:
          type: string
          description: Google Identity Services credential (JWT) from the browser
          example: eyJhbGciOiJSUzI1NiIsImtpZCI6IjE...

    OtpChallenge:
      type: object
      properties:
        message:
          type: string
          example: Verification code sent to user@example.com
        email:
          type: string
          format: email
          example: user@example.com
        expires_in_seconds:
          type: integer
          description: Lifetime of the emailed OTP
          example: 600

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    ForgotPasswordBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordBody:
      type: object
      required: [token, new_password]
      properties:
        token:
          type: string
          description: Raw reset token from the email link (hashed server-side for lookup)
          example: 8f14e45fceea167a5a36dedd4bea2543
        new_password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter, one lowercase letter and one number
          example: NewPassword1

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: user@example.com
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/avatars/123.png
        emailVerifiedAt:
          type: string
          format: date-time
          nullable: true
        lastActiveStartupId:
          type: string
          format: uuid
          nullable: true
          description: >
            Which workspace to reopen on load. Null for someone who has neither
            created a startup nor accepted an invite — a client should route
            those users to onboarding instead of into a 403. Only returned by
            GET /auth/me; the sign-in responses carry a narrower user object.
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri

    ChangePasswordBody:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: Password1
        newPassword:
          type: string
          minLength: 8
          example: NewPassword1

    # ── Startups ──────────────────────────────────────────────────────
    FundingStage:
      type: string
      enum: [pre_seed, seed, series_a, series_b, series_c, growth, other]
      example: seed

    Startup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme Inc.
        description:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
          example: Fintech
        website:
          type: string
          format: uri
          nullable: true
        fundingStage:
          $ref: "#/components/schemas/FundingStage"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # A startup plus the caller's own membership in it, so a client can render
    # a workspace list and know its role in each without a request per row.
    StartupWithMembership:
      allOf:
        - $ref: "#/components/schemas/Startup"
        - type: object
          properties:
            member:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                status:
                  $ref: "#/components/schemas/MemberStatus"
                role:
                  type: string
                  enum: [owner, collaborator, viewer]
                joinedAt:
                  type: string
                  format: date-time
                  nullable: true

    CreateStartupBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Acme Inc.
        description:
          type: string
        industry:
          type: string
          example: Fintech
        website:
          type: string
          format: uri
        fundingStage:
          $ref: "#/components/schemas/FundingStage"

    UpdateStartupBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
        industry:
          type: string
        website:
          type: string
          format: uri
        fundingStage:
          $ref: "#/components/schemas/FundingStage"

    # ── RBAC ──────────────────────────────────────────────────────────
    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resource:
          type: string
          example: documents
        action:
          type: string
          example: delete
        description:
          type: string
          nullable: true

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        name:
          type: string
          example: Finance Lead
        description:
          type: string
          nullable: true
        isSystemRole:
          type: boolean
          example: false
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time

    CreateRoleBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Finance Lead
        description:
          type: string
        permissionIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateRoleBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string

    SetRolePermissionsBody:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
          description: Full replacement set of permission IDs for this role

    # ── Startup Members ───────────────────────────────────────────────
    MemberStatus:
      type: string
      enum: [pending, active]
      description: A row is "pending" from the moment it is invited until the invite is accepted.
      example: active

    # The roles a member can hold within one startup. Roles are created per
    # startup when the workspace is created, so ids are never portable between
    # startups — this is the only way to resolve one for an invite or a role change.
    StartupRoleSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          enum: [owner, collaborator, viewer]
          example: collaborator
        description:
          type: string
          nullable: true
          example: Can edit pipeline and documents, no billing access
        isSystemRole:
          type: boolean
          example: true

    # A member row arrives in one of two shapes: someone who has accepted
    # carries `user`, while a pending invite carries `invitedEmail` and has no
    # account attached to it yet.
    StartupMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MemberStatus"
        role:
          type: string
          enum: [owner, collaborator, viewer]
          description: Role name, not id. Use GET /startups/{startupId}/roles to resolve an id.
          example: owner
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        user:
          type: object
          description: Present only once the invitation has been accepted.
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
            avatarUrl:
              type: string
              format: uri
              nullable: true
        invitedEmail:
          type: string
          format: email
          nullable: true
          description: Present instead of `user` while the invitation is still pending.

    # The raw membership row returned by the role-change endpoint.
    MembershipRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        roleId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MemberStatus"
        invitedEmail:
          type: string
          format: email
          nullable: true
        invitedBy:
          type: string
          format: uuid
          nullable: true
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    InviteMemberBody:
      type: object
      required: [email, roleId]
      properties:
        email:
          type: string
          format: email
          example: newmember@example.com
        roleId:
          type: string
          format: uuid

    ChangeRoleBody:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: string
          format: uuid
          description: Must be a role belonging to the same startup

    AcceptInviteBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Raw invite token from the email link
          example: 7c6a180b36896a0a8c02787eeafb0e4c

    # ── CRM: Investors ────────────────────────────────────────────────
    InvestorType:
      type: string
      enum: [vc, angel, family_office, accelerator, other]
      example: vc

    # Derived from activity rather than stored, so it cannot drift from what the
    # team has actually done: a contact is "engaged" once it has a pipeline
    # entry or at least one interaction log, and a "prospect" until then.
    PendingInvite:
      type: object
      description: An invitation waiting for the signed-in user.
      properties:
        id:
          type: string
          format: uuid
          description: The membership id — what the accept and decline paths take
        createdAt:
          type: string
          format: date-time
        inviteExpiresAt:
          type: string
          format: date-time
          nullable: true
        startup:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            industry:
              type: string
            fundingStage:
              type: string
        role:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        inviter:
          type: object
          nullable: true
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          description: >
            Rendered specially when known. The API currently emits
            "team_invite" and "followup_due"; anything else falls back to a
            generic icon on the client.
          example: team_invite
        title:
          type: string
        body:
          type: string
          nullable: true
        entityType:
          type: string
          nullable: true
          description: >
            What entityId points at, e.g. "startup_member" for a
            "team_invite" notification or "interaction_log" for a
            "followup_due" one
        entityId:
          type: string
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        startup:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Engagement:
      type: string
      enum: [engaged, prospect]
      example: engaged

    InvestorListMeta:
      allOf:
        - $ref: "#/components/schemas/PaginationMeta"
        - type: object
          properties:
            engagementCounts:
              type: object
              description: >
                How many contacts fall on each side of the split. Both counts
                honour the other active filters (search, investorType, stage)
                but ignore `engagement` itself, so a client can label both tabs
                from one request. `total` reflects the requested view: one of
                the two counts when `engagement` is set, their sum when not.
              properties:
                engaged:
                  type: integer
                  example: 10
                prospect:
                  type: integer
                  example: 8

    # An investor contact private to one startup. Contacts are never shared
    # between startups — two startups tracking the same person hold two
    # independent records.
    Investor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        fullName:
          type: string
          example: John Smith
        email:
          type: string
          format: email
          nullable: true
          description: Optional — a contact can be added before an address is known.
        ventureFirm:
          type: string
          nullable: true
          example: Acme Ventures
        investorType:
          allOf:
            - $ref: "#/components/schemas/InvestorType"
          nullable: true
        sectorFocus:
          type: string
          nullable: true
          example: Fintech, SaaS
        investmentStagePreference:
          type: string
          nullable: true
          example: Seed, Series A
        linkedinUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          example: event
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # A contact joined to its pipeline entry and next follow-up — the shape the
    # Investors screen renders.
    InvestorListItem:
      allOf:
        - $ref: "#/components/schemas/Investor"
        - type: object
          properties:
            pipeline:
              nullable: true
              description: Null when the contact has not been added to the pipeline.
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                stage:
                  $ref: "#/components/schemas/PipelineStage"
                expectedAmount:
                  type: number
                  format: double
                  nullable: true
                probabilityPercentage:
                  type: integer
                  nullable: true
            nextFollowupDate:
              type: string
              format: date-time
              nullable: true
              description: >
                Earliest upcoming nextFollowupDate across this contact's
                interaction logs; null when none is scheduled.

    CreateInvestorBody:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          description: Optional, but must be unique within the startup when given.
        ventureFirm:
          type: string
        investorType:
          $ref: "#/components/schemas/InvestorType"
        sectorFocus:
          type: string
        investmentStagePreference:
          type: string
        linkedinUrl:
          type: string
          format: uri
          description: Must use http or https.
        notes:
          type: string
        source:
          type: string

    UpdateInvestorBody:
      type: object
      description: All fields optional; at least one required.
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
        ventureFirm:
          type: string
        investorType:
          $ref: "#/components/schemas/InvestorType"
        sectorFocus:
          type: string
        investmentStagePreference:
          type: string
        linkedinUrl:
          type: string
          format: uri
        notes:
          type: string
        source:
          type: string

    # ── CRM: Pipeline ─────────────────────────────────────────────────
    PipelineStage:
      type: string
      enum: [sourced, contacted, meeting_scheduled, due_diligence, term_sheet, committed, passed]
      example: meeting_scheduled

    PipelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        investor:
          $ref: "#/components/schemas/Investor"
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
          nullable: true
          example: 250000
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          example: 60
        sortOrder:
          type: number
          format: double
          description: >-
            Manual position within its stage's column, ascending. Not
            necessarily contiguous — the client places a moved card by
            averaging the sortOrder of its new neighbors.
          example: 2000
        stageChangedAt:
          type: string
          format: date-time
          description: >-
            When the deal last moved stage. Distinct from updatedAt, which also
            moves when the amount or probability is edited.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PipelineAnalytics:
      type: object
      description: >-
        Funnel and velocity derived from append-only stage history. Deals created
        before stage history existed contribute a single backfilled "joined"
        event, so they count toward reach but show no movement until next moved.
      properties:
        totalDeals:
          type: integer
        funnel:
          type: array
          items:
            type: object
            properties:
              stage:
                $ref: "#/components/schemas/PipelineStage"
              current:
                type: integer
                description: Deals sitting in this stage right now.
              currentValue:
                type: number
                format: double
              everReached:
                type: integer
                description: Deals that have ever occupied this stage.
              medianDaysInStage:
                type: number
                format: double
                nullable: true
                description: >-
                  Median length of completed visits to this stage. The current
                  occupancy is still running so it is excluded.
        conversion:
          type: array
          items:
            type: object
            properties:
              fromStage:
                $ref: "#/components/schemas/PipelineStage"
              toStage:
                $ref: "#/components/schemas/PipelineStage"
              reached:
                type: integer
              advanced:
                type: integer
                description: Of those that reached fromStage, how many went further.
              rate:
                type: number
                format: double
                nullable: true
                description: advanced / reached; null when nothing reached the stage.
        outcomes:
          type: object
          properties:
            open:
              type: integer
            committed:
              type: integer
            passed:
              type: integer
            winRate:
              type: number
              format: double
              nullable: true
              description: committed / (committed + passed); null before anything is decided.

    CreatePipelineEntryBody:
      type: object
      required: [investorId, stage]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100

    UpdatePipelineEntryBody:
      type: object
      description: At least one field is required.
      properties:
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
          nullable: true
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        sortOrder:
          type: number
          format: double
          description: >-
            New position within its (possibly new) stage. Usually the
            midpoint of the sortOrder of the two cards it now sits between.

    # ── CRM: Interaction Logs ─────────────────────────────────────────
    InteractionType:
      type: string
      enum: [call, email, meeting, note, other]
      example: meeting

    InteractionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        interactionDate:
          type: string
          format: date-time
          nullable: true
        nextFollowupDate:
          type: string
          format: date-time
          nullable: true
        followupCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            Null while the follow-up is outstanding. Set when it is marked done,
            or automatically when a later interaction is logged for the same
            contact that satisfies it (logged on or after the follow-up date).
        createdAt:
          type: string
          format: date-time

    PipelineStageEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fromStage:
          allOf:
            - $ref: "#/components/schemas/PipelineStage"
          nullable: true
          description: Null for the first event — the deal being added to the pipeline.
        toStage:
          $ref: "#/components/schemas/PipelineStage"
        changedBy:
          type: string
          format: uuid
          nullable: true
          description: Null if the member who made this change has since been removed.
        createdAt:
          type: string
          format: date-time

    CreateInteractionLogBody:
      type: object
      required: [investorId, type, interactionDate]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
        description:
          type: string
        interactionDate:
          type: string
          format: date-time
        nextFollowupDate:
          type: string
          format: date-time

    # At least one field is required. Nullable fields accept an explicit null
    # to clear the stored value.
    UpdateInteractionLogBody:
      type: object
      minProperties: 1
      properties:
        pipelineId:
          type: string
          format: uuid
          nullable: true
          description: Must belong to the same investor contact as the log
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        interactionDate:
          type: string
          format: date-time
          nullable: true
        nextFollowupDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            Setting a new date reopens the follow-up, clearing any prior
            followupCompletedAt unless one is sent in the same request.
        followupCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: Marks the follow-up done; null reopens it.

    # ── Financial: Fundraising Rounds ─────────────────────────────────
    RoundStatus:
      type: string
      enum: [draft, open, closed, cancelled]
      example: open

    FundraisingRound:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        roundName:
          type: string
          example: Seed Round
        targetAmount:
          type: number
          format: double
          example: 1500000
        minimumTicketSize:
          type: number
          format: double
          nullable: true
          example: 25000
        equityOfferedPercentage:
          type: number
          format: double
          nullable: true
          example: 12.5
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/RoundStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFundraisingRoundBody:
      type: object
      required: [roundName, targetAmount, currency]
      properties:
        roundName:
          type: string
          minLength: 2
          maxLength: 150
        targetAmount:
          type: number
          format: double
          minimum: 0
        minimumTicketSize:
          type: number
          format: double
          minimum: 0
        equityOfferedPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/RoundStatus"

    UpdateFundraisingRoundBody:
      type: object
      properties:
        roundName:
          type: string
          minLength: 2
          maxLength: 150
        targetAmount:
          type: number
          format: double
          minimum: 0
        minimumTicketSize:
          type: number
          format: double
          minimum: 0
        equityOfferedPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        currency:
          type: string
        status:
          $ref: "#/components/schemas/RoundStatus"

    # ── Financial: Commitments ────────────────────────────────────────
    CommitmentStatus:
      type: string
      enum: [pending, negotiating, confirmed, funded, withdrawn]
      example: pending

    Commitment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        investor:
          $ref: "#/components/schemas/Investor"
        pipelineId:
          type: string
          format: uuid
          nullable: true
        roundId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          example: 50000
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommitmentBody:
      type: object
      required: [investorId, roundId, amount]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
        roundId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date

    UpdateCommitmentBody:
      type: object
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date

    # ── Documents ───────────────────────────────────────────────────
    DocumentType:
      type: string
      enum: [pitch_deck, financial_model, cap_table, term_sheet, data_room, other]
      example: pitch_deck

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        title:
          type: string
          example: Series A Pitch Deck
        documentType:
          $ref: "#/components/schemas/DocumentType"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDocumentBody:
      type: object
      required: [title, documentType]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"

    UpdateDocumentBody:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          example: 3
        isCurrent:
          type: boolean
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          description: File size in bytes
          example: 2485760
        summary:
          type: string
          nullable: true
          description: Description of what changed in this version
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateDocumentVersionBody:
      type: object
      required: [fileUrl, fileSize]
      properties:
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          minimum: 0
        summary:
          type: string

    # ── Reviewer ──────────────────────────────────────────────────────
    ReviewerInvitationStatus:
      type: string
      enum: [pending, accessed, expired, revoked]
      example: pending

    ReviewerInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          nullable: true
          description: Set when the reviewer is a known investor from the CRM
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ReviewerInvitationStatus"
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          description: Documents this invitation grants access to
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateReviewerInvitationBody:
      type: object
      required: [email, documentIds]
      properties:
        email:
          type: string
          format: email
        investorId:
          type: string
          format: uuid
          description: Optional — link to an existing CRM investor record
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        expiresAt:
          type: string
          format: date-time
          description: Defaults to 14 days from creation if omitted

    UpdateReviewerInvitationBody:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [revoked]
          description: Owners may only transition status to "revoked" via this endpoint

    # ── Reviewer Portal (public, token + OTP) ──────────────────────────
    ReviewerPortalAccessBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Raw invitation token from the emailed link
          example: 3a7bd3e2360a3d29eea436fcfb7e44542f4e4cd2e3e4a3c

    ReviewerPortalVerifyBody:
      type: object
      required: [token, code]
      properties:
        token:
          type: string
          example: 3a7bd3e2360a3d29eea436fcfb7e44542f4e4cd2e3e4a3c
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit OTP code emailed to the invitation address
          example: "482913"

    ReviewerPortalSession:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/ReviewerInvitation"
        startup:
          $ref: "#/components/schemas/Startup"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"

    # ── Reviewer Comments ─────────────────────────────────────────────
    ReviewerComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
          nullable: true
        chunkId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReviewerCommentBody:
      type: object
      required: [commentText]
      properties:
        documentId:
          type: string
          format: uuid
          nullable: true
        chunkId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
          minLength: 1

# ─── Paths ─────────────────────────────────────────────────────────────────────
paths:
  # ════════════════════════════════════════════════════════════════
  #  AUTH
  # ════════════════════════════════════════════════════════════════
  /auth/register/initiate:
    post:
      tags: [Auth]
      summary: Start registration and email a verification code
      operationId: registerInitiate
      description: >
        Stores a pending registration and emails a 6-digit OTP. No user account
        exists until POST /auth/register/verify succeeds. Responds 200 with the
        same body whether or not the email is already taken, so the endpoint
        cannot be used to enumerate accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInitiateBody"
      responses:
        "200":
          description: Verification code sent (or silently skipped for an existing account)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OtpChallenge"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/resend:
    post:
      tags: [Auth]
      summary: Resend the registration verification code
      operationId: registerResend
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterResendBody"
      responses:
        "200":
          description: A fresh code was sent if a pending registration exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/OtpChallenge"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/verify:
    post:
      tags: [Auth]
      summary: Verify the code, create the account and sign in
      operationId: registerVerify
      description: >
        On success the pending registration becomes a real user, auth cookies
        are set, and any unexpired invitations addressed to that email are
        claimed automatically — so an invited person lands in their workspace
        without visiting the invite link again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterVerifyBody"
      responses:
        "201":
          description: Account created and signed in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api/v1
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/google:
    post:
      tags: [Auth]
      summary: Sign in or register with a Google ID token
      operationId: googleAuth
      description: >
        Verifies the Google credential, then links or creates the account and
        sets auth cookies. Returns 201 for a newly created user and 200 for an
        existing one. Like OTP registration, this claims any pending invitations
        for the verified email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleAuthBody"
      responses:
        "200":
          description: Existing user signed in
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api/v1
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      is_new_user:
                        type: boolean
                        example: false
        "201":
          description: New user created and signed in
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      is_new_user:
                        type: boolean
                        example: true
        "401":
          description: Invalid Google token, or the Google email is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive auth cookies
      operationId: login
      description: >
        On success, sets two HttpOnly cookies: `accessToken` (15 min) and
        `refreshToken` (7 days). Include `credentials: "include"` in fetch calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: Reads the `refreshToken` cookie and issues new auth cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear auth cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      operationId: forgotPassword
      description: >
        Always returns 200 regardless of whether the email exists, to avoid
        leaking which addresses are registered. If found, an email is sent
        with a single-use token (10-minute family rotation tracked server-side).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset email sent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token from the reset email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  USERS (current user profile)
  # ════════════════════════════════════════════════════════════════
  /users/me:
    patch:
      tags: [Users]
      summary: Update the current user's profile
      operationId: updateMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  STARTUPS
  # ════════════════════════════════════════════════════════════════
  /startups:
    get:
      tags: [Startups]
      summary: List the workspaces the current user can open
      operationId: listStartups
      description: >
        Scoped by the caller's active memberships, so this is the one startup
        endpoint that takes no startupId — it is what a client calls before it
        knows which workspace it is in. Pending invitations are excluded, since
        they are not openable. Not paginated: a user belongs to a handful of
        workspaces. An empty list means the user has no workspace yet and should
        be sent to onboarding — it is not a permission failure.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Workspaces the caller is an active member of, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      startups:
                        type: array
                        items:
                          $ref: "#/components/schemas/StartupWithMembership"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Startups]
      summary: Create a new startup
      operationId: createStartup
      description: The creator automatically becomes a member with the default "Owner" system role.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStartupBody"
      responses:
        "201":
          description: Startup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startups]
      summary: Get a startup by ID
      operationId: getStartup
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Startup details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Startups]
      summary: Update a startup
      operationId: updateStartup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStartupBody"
      responses:
        "200":
          description: Startup updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Startups]
      summary: Delete a startup
      operationId: deleteStartup
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Startup deleted (no body)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/password:
    patch:
      tags: [Users]
      summary: Change the current user's password
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized or current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  STARTUP MEMBERS
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/roles:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startup Members]
      summary: List the roles assignable within a startup
      operationId: listStartupRoles
      description: >
        Roles are created per startup, so their ids are not portable between
        workspaces. This is the only way to resolve the `roleId` required by the
        invite and role-change endpoints. Ordered most privileged first.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Roles belonging to this startup
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      roles:
                        type: array
                        items:
                          $ref: "#/components/schemas/StartupRoleSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing team:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/members:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startup Members]
      summary: List members of a startup
      operationId: listStartupMembers
      description: >
        Returns accepted members and pending invitations in one list, oldest
        first. The response is not paginated. The caller's own row is included,
        which is how a client determines its own role.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Members and pending invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          $ref: "#/components/schemas/StartupMember"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing team:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/invites:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Startup Members]
      summary: Invite a person to join the startup
      operationId: inviteStartupMember
      description: >
        Creates a member row with status "pending" and emails a time-limited
        invite link (valid for 7 days). `userId` stays null until the invite is
        accepted. Assigning the owner role requires the caller to be an owner.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberBody"
      responses:
        "201":
          description: >
            Invitation created. `emailQueued` is false when the member row was
            committed but the notification email could not be queued (e.g. a
            Redis outage) — the caller should tell the inviter to follow up with
            the person directly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  emailQueued:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:create, or OWNER_ONLY when assigning the owner role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: ROLE_NOT_FOUND — the role does not belong to this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_MEMBER — already a member or already invited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/invites/{memberId}/resend:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Startup Members]
      summary: Reissue and resend a pending invitation
      operationId: resendStartupInvite
      description: >
        Mints a new token and restarts the 7-day clock, then emails the link
        again. Only the hash of the previous token is stored, so the old link
        cannot be re-sent — it is replaced, and any copy already sitting in an
        inbox stops working.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: >
            A new link was issued. `emailQueued` is false when the token was
            rotated but the mail could not be queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  emailQueued:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_ACCEPTED — there is nothing left to resend
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/activate:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Startups]
      summary: Remember this workspace as the caller's active one
      operationId: activateStartup
      description: >
        Sets lastActiveStartupId for the signed-in user so the choice of
        workspace follows them to another device instead of living only in one
        browser's storage. Any active member may call it, whatever their role.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Recorded (no body)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member of this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/members/{memberId}/role:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Startup Members]
      summary: Change a member's role
      operationId: changeStartupMemberRole
      description: >
        Works on pending invitations as well as accepted members. The last
        active owner cannot be demoted, and only an owner may grant the owner
        role.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MembershipRecord"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:update, or OWNER_ONLY when granting the owner role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found, or ROLE_NOT_FOUND in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: LAST_OWNER — cannot change the role of the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/members/{memberId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Startup Members]
      summary: Remove a member, or revoke a pending invitation
      operationId: removeStartupMember
      description: >
        Callers may remove themselves, which is how leaving a workspace works.
        The last active owner cannot be removed.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Member removed (no body)
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing team:delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: LAST_OWNER — cannot remove the last active owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/mine:
    get:
      tags: [Startup Members]
      summary: Invitations waiting for the signed-in user
      operationId: listMyInvites
      description: >
        Pending, unexpired invitations addressed to the caller's own email.
        Someone who was already signed in when the invitation arrived accepts it
        from inside the app; the emailed token is only one of two routes in.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The caller's pending invitations, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/PendingInvite"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/mine/{memberId}/accept:
    post:
      tags: [Startup Members]
      summary: Accept an invitation addressed to you
      operationId: acceptMyInvite
      description: >
        Accepts by membership id rather than by token — the session already
        proves who the caller is. An invitation addressed to anybody else is
        reported as 404, not 403: the caller has no business learning it exists.
      security:
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The membership, now active
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MembershipRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND — no pending invitation for this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ALREADY_ACCEPTED — the invitation is no longer pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: TOKEN_EXPIRED — the invitation is older than 7 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/mine/{memberId}/decline:
    post:
      tags: [Startup Members]
      summary: Decline an invitation addressed to you
      operationId: declineMyInvite
      description: >
        Removes the pending membership. An owner may send a fresh invitation
        afterwards.
      security:
        - cookieAuth: []
      parameters:
        - name: memberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Invitation declined
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND — no pending invitation for this caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  NOTIFICATIONS
  # ════════════════════════════════════════════════════════════════
  /notifications:
    get:
      tags: [Notifications]
      summary: List the signed-in user's notifications
      operationId: listNotifications
      description: >
        Notifications belong to a user, not to a workspace — someone who has
        been invited but has not joined anything yet still sees the invitation
        on their otherwise empty dashboard. There is therefore no startupId in
        the path and no membership check.
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
        - name: unread
          in: query
          description: Restrict to unread notifications.
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Notification"
                  meta:
                    type: object
                    properties:
                      unreadCount:
                        type: integer
                        description: Total unread, independent of limit and filter
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/stream:
    get:
      tags: [Notifications]
      summary: Live notification stream (server-sent events)
      operationId: streamNotifications
      description: >
        A long-lived text/event-stream carrying the caller's notification
        events. Chosen over WebSockets because the traffic is one-directional:
        it rides ordinary HTTP, so cookie auth applies unchanged and the browser
        reconnects on its own (the stream advertises `retry: 5000`).


        Events are signals, not data — each one means "refetch". A comment
        heartbeat is sent every 25s to stop idle proxies hanging up, and the
        response sets `X-Accel-Buffering: no` because nginx would otherwise
        buffer the stream indefinitely.


        Event names: `ready` once on connect; `notification.created` when one
        arrives; `notifications.changed` when the unread state moved elsewhere
        (another tab marking read, or an invitation being accepted).


        Fan-out is in-process today, so this only reaches clients connected to
        the same API instance. Running more than one requires a shared bus.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: An open event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                retry: 5000

                event: ready
                data: {}

                event: notification.created
                data: {"type":"notification.created","notification":{"id":"…","type":"team_invite","title":"You've been invited to Acme Corp","body":"Join as collaborator to start collaborating."}}

                : ping

        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark every notification read
      operationId: markAllNotificationsRead
      security:
        - cookieAuth: []
      responses:
        "200":
          description: How many were marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: integer
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification read
      operationId: markNotificationRead
      security:
        - cookieAuth: []
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked read
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: NOT_FOUND — no such notification for this user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /invites/accept:
    post:
      tags: [Startup Members]
      summary: Accept a startup membership invitation
      operationId: acceptStartupInvite
      description: >
        Reachable signed-out, but the membership is only ever activated for a
        signed-in user whose account email matches the invited address. Holding
        the link is not enough: an anonymous caller, or one signed in as anybody
        else, gets a 202 or 403 and the invitation is left untouched.


        Accepting is idempotent — the invited member may open the link again
        (including after registration already claimed the invite) and gets 200
        with the same membership rather than an error.
      security:
        - cookieAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteBody"
      responses:
        "200":
          description: >
            The membership was activated for the signed-in user, or already
            belonged to them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MembershipRecord"
        "202":
          description: >
            Nobody is signed in as the invited person yet, so nothing was
            changed. `requiresRegistration` means no account exists for the
            invited address — registering with it claims the invite
            automatically. `requiresLogin` means the account exists and only
            needs to sign in.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [requiresRegistration, email]
                    properties:
                      requiresRegistration:
                        type: boolean
                        example: true
                      email:
                        type: string
                        format: email
                        description: The invited address — the account must be created with it
                  - type: object
                    required: [requiresLogin, email]
                    properties:
                      requiresLogin:
                        type: boolean
                        example: true
                      email:
                        type: string
                        format: email
                        description: The invited address — sign in as this account to accept
        "403":
          description: >
            EMAIL_MISMATCH — signed in as someone other than the invited person.
            The invitation stays pending.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      invitedEmail:
                        type: string
                        format: email
                      signedInAs:
                        type: string
                        format: email
        "404":
          description: INVALID_TOKEN — no invitation matches this token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            ALREADY_ACCEPTED — this invitation was already used by the person it
            was sent to.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: TOKEN_EXPIRED — the invitation is older than 7 days
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  ROLES (RBAC)
  # ════════════════════════════════════════════════════════════════
  /roles:
    get:
      tags: [Roles]
      summary: List roles for the current startup
      operationId: listRoles
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Roles]
      summary: Create a custom role
      operationId: createRole
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBody"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A role with this name already exists for this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: Get a role by ID
      operationId: getRole
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Roles]
      summary: Update a role's name or description
      operationId: updateRole
      description: System roles cannot be renamed; returns 403 if attempted.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
