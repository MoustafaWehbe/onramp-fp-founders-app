  #  INTERACTION LOGS (CRM)
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/interaction-logs:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Interaction Logs]
      summary: Log an interaction with an investor
      operationId: createInteractionLog
      description: >
        `pipelineId` is optional, so interactions can be logged before an
        investor formally enters the pipeline. When it is supplied, the pipeline
        entry must belong to the same investor contact.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInteractionLogBody"
      responses:
        "201":
          description: Interaction log created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractionLog"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: INVESTOR_NOT_FOUND no such contact in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Validation error, or PIPELINE_MISMATCH when the pipeline entry
            belongs to a different investor contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    get:
      tags: [Interaction Logs]
      summary: List every interaction log in a startup
      operationId: listInteractionLogs
      description: Newest first, across all of the startup's investor contacts.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of interaction logs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/InteractionLog"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/interaction-logs/{logId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: logId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Interaction Logs]
      summary: Get an interaction log by ID
      operationId: getInteractionLog
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Interaction log details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractionLog"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: LOG_NOT_FOUND no such log in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Interaction Logs]
      summary: Update an interaction log
      operationId: updateInteractionLog
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInteractionLogBody"
      responses:
        "200":
          description: Interaction log updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/InteractionLog"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: LOG_NOT_FOUND no such log in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: >
            Validation error, or PIPELINE_MISMATCH when the new pipeline entry
            belongs to a different investor contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Interaction Logs]
      summary: Delete an interaction log
      operationId: deleteInteractionLog
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Interaction log deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BareMessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: LOG_NOT_FOUND no such log in this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  TASKS (CRM)
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/tasks:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Tasks]
      summary: Add a task to a pipeline deal
      operationId: createTask
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskBody"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: PIPELINE_NOT_FOUND or MEMBER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    get:
      tags: [Tasks]
      summary: List tasks in a startup
      operationId: listTasks
      description: >
        Filterable by pipelineId, investorId, roundId, status, assigneeId, and priority —
        used both for a single deal's task list and cross-deal views.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: pipelineId
          in: query
          schema:
            type: string
            format: uuid
        - name: investorId
          in: query
          description: Every task associated with this investor across their pipeline deals.
          schema:
            type: string
            format: uuid
        - name: roundId
          in: query
          description: >-
            Every task on every deal in one fundraising round, scoped through
            the deal since a task carries no round of its own.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - name: assigneeId
          in: query
          schema:
            type: string
            format: uuid
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/Priority"
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/tasks/{taskId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: taskId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: Get a task by ID
      operationId: getTask
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TASK_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Tasks]
      summary: Update a task
      description: >
        Setting status to "completed" stamps completedAt server-side;
        reverting to "open" clears it.
      operationId: updateTask
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskBody"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Task"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TASK_NOT_FOUND or MEMBER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Tasks]
      summary: Delete a task
      operationId: deleteTask
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Task removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BareMessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing pipeline:delete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: TASK_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  CHAT
  # ════════════════════════════════════════════════════════════════
  /startups/{startupId}/chat/conversations:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Chat]
      summary: Create a channel
      description: >
        Creates a channel for the selected active workspace members. The creator
        is included automatically even when omitted from memberIds.
      operationId: createConversation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationBody"
      responses:
        "201":
          description: Channel created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CONVERSATION_NAME_TAKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    get:
      tags: [Chat]
      summary: List the caller's channels
      description: Channels the caller is a member of, most recently active first.
      operationId: listConversations
      security:
        - cookieAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          description: Include archived channels the caller belongs to.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: List of channels
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/chat/dm:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Chat]
      summary: Start or reuse a 1:1 direct message
      description: >
        Finds the existing DM with this member if one exists (keyed on the
        sorted member-id pair), otherwise creates it. Idempotent from either
        side of the pair.
      operationId: startDirectMessage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartDirectMessageBody"
      responses:
        "201":
          description: The DM conversation, new or pre-existing
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Conversation"
        "400":
          description: INVALID_DM_TARGET cannot DM yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MEMBER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/chat/conversations/{conversationId}/messages:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Chat]
      summary: List messages in a channel
      description: >
        Cursor pagination on `seq` pass the oldest message's `seq` on the
        current page as `before` to load the page above it. Returned
        oldest-first.
      operationId: listMessages
      security:
        - cookieAuth: []
      parameters:
        - name: before
          in: query
          schema:
            type: string
            pattern: "^\\d+$"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Chat]
      summary: Send a message
      operationId: sendMessage
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageBody"
      responses:
        "201":
          description: >-
            Message sent, or the original message when clientNonce matches an
            existing send.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/chat/conversations/{conversationId}/messages/{messageId}/replies:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Chat]
      summary: List a thread's replies
      description: >
        Threads are flat and unpaginated beyond `limit` replying to a reply
        re-parents onto the same top-level message rather than nesting.
      operationId: listReplies
      security:
        - cookieAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: The parent message and its replies, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ReplyThread"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND or MESSAGE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/chat/conversations/{conversationId}/read:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Chat]
      summary: Mark a channel read
      description: Advances the caller's read pointer to the latest top-level message clears its unread badge.
      operationId: markRead
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The caller's new read pointer
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      lastReadSeq:
                        type: string
                        nullable: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/chat/conversations/{conversationId}/notify-level:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Chat]
      summary: Set the caller's mute level for a channel
      description: >-
        "all" and "mentions" currently behave identically chat volume
        itself never raises a Notification row, so only "none" (fully muted)
        has an observable effect: it also suppresses the @-mention
        notification for this conversation.
      operationId: setNotifyLevel
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotifyLevelBody"
      responses:
        "200":
          description: The new mute level
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      notifyLevel:
                        type: string
                        enum: [all, mentions, none]
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/chat/conversations/{conversationId}/archived:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Chat]
      summary: Archive or unarchive a channel
      description: >-
        This is a moderation action gated by chat:manage, not something every
        member can do to a room they share.
        DMs cannot be archived (400 CANNOT_ARCHIVE_DM) there is no shared
        room to moderate, only two people's own conversation.
      operationId: setConversationArchived
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveConversationBody"
      responses:
        "200":
          description: The conversation's new archived state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      archivedAt:
                        type: string
                        format: date-time
                        nullable: true
        "400":
          description: CANNOT_ARCHIVE_DM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:manage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/chat/conversations/{conversationId}/typing:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: conversationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Chat]
      summary: Ping "I am typing" to the rest of the room
      description: >-
        Fire-and-forget no row is written. Fans out a chat.typing SSE event
        to the conversation's other members; the client lets it expire a few
        seconds after the last ping.
      operationId: notifyTyping
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Ping sent
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/chat/messages/{messageId}/reactions:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Chat]
      summary: Toggle a reaction on a message
      description: Posting the same emoji a second time removes it this is a toggle, not an add-only endpoint.
      operationId: toggleReaction
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToggleReactionBody"
      responses:
        "200":
          description: The message's fresh reaction summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      messageId:
                        type: string
                        format: uuid
                      reactions:
                        type: array
                        items:
                          $ref: "#/components/schemas/MessageReactionSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:create
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MESSAGE_NOT_FOUND or CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/chat/messages/{messageId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: messageId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Chat]
      summary: Delete a message (soft-delete / tombstone)
      description: >-
        Never a hard delete deletedAt is set and the row survives for the
        audit trail, but the response and every other client's view have the
        body, reactions, and attachments blanked. Self-serve only: retracts
        the caller's own message. There is no moderator override.
      operationId: deleteMessage
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The now-tombstoned message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, missing chat:create, or the message belongs to someone else
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: MESSAGE_NOT_FOUND or CONVERSATION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: MESSAGE_ALREADY_DELETED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/chat/mentionables:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Chat]
      summary: Autocomplete for @-references
      description: >
        Fans out across members, investors, deals, tasks, rounds and
        documents. Each type is only searched if the caller's role holds the
        read permission that type is gated on (deal/investor/task need
        pipeline:read, round needs financial:read, document needs
        documents:read; member needs nothing beyond chat:read itself) —
        filtered server-side, not left to the client to hide.
      operationId: searchMentionables
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 120
          description: Empty or missing returns no results.
        - name: types
          in: query
          schema:
            type: string
          description: Comma-separated MentionTargetType values, e.g. "deal,investor".
      responses:
        "200":
          description: Matching items, grouped by type in the response array
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MentionableItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startups/{startupId}/chat/resolve:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Chat]
      summary: Batch-render reference chips into unfurl cards
      description: >
        One request per message list instead of one per chip. An item the
        caller cannot read, or that no longer exists, is simply absent from
        the response the client falls back to the token's plain-text
        label rather than the whole render failing.
      operationId: resolveMentions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveMentionsBody"
      responses:
        "200":
          description: Resolved items may be fewer than requested
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ResolvedMention"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an active member, or missing chat:read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}/chat/mentions:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Chat]
      summary: Backlink every message that references one entity
      description: >
        Powers the Discussion tab on a deal (and, by the same query, any
        other entity type). Scoped to conversations the caller is a member
        of, newest first.
      operationId: listMentions
      security:
        - cookieAuth: []
      parameters:
        - name: targetType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MentionTargetType"
        - name: targetId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Messages referencing the entity, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MentionBacklinkEntry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            Not an active member, missing chat:read, or missing the read
            permission targetType is gated on (e.g. financial:read for a round)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

