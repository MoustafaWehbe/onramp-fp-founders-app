openapi: 3.1.0

info:
  title: Fundraising SaaS API
  version: 1.0.0
  description: REST API for the Fundraising SaaS application (Auth, RBAC, CRM, Financial, Documents, Reviewer Portal)

servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: /api/v1
    description: Same-origin

tags:
  - name: Auth
    description: Authentication and session management
  - name: Users
    description: Current user profile management
  - name: Startups
    description: Startup workspace management
  - name: Startup Members
    description: Team membership and invitations within a startup
  - name: Roles
    description: Custom and system roles (RBAC)
  - name: Permissions
    description: Available permission catalog (RBAC)
  - name: Investors
    description: Investor CRM records
  - name: Pipeline
    description: Investor pipeline / deal stages
  - name: Interaction Logs
    description: Logged interactions with investors
  - name: Fundraising Rounds
    description: Fundraising round management
  - name: Commitments
    description: Investor commitments against fundraising rounds
  - name: Documents
    description: Document vault
  - name: Document Versions
    description: Versioned files within a document
  - name: Reviewer Invitations
    description: Invitations granting external reviewers access to documents
  - name: Reviewer Portal
    description: Public-facing endpoints used by external reviewers (token + OTP based, no cookieAuth)
  - name: Reviewer Comments
    description: Comments left by reviewers on documents/sections

# ─── Reusable components ───────────────────────────────────────────────────────
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
      description: HttpOnly access token cookie set on login

    reviewerSessionAuth:
      type: apiKey
      in: cookie
      name: reviewerSessionToken
      description: >
        HttpOnly session cookie set after a reviewer completes token + OTP
        verification via POST /reviewer-portal/verify. Required for all
        subsequent Reviewer Portal calls.

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of items per page

  schemas:
    # ── Shared / generic ─────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Invalid credentials

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Invalid email address

    MessageResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            message:
              type: string
              example: Success

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 134
        totalPages:
          type: integer
          example: 7

    # ── Auth ──────────────────────────────────────────────────────────
    RegisterBody:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          description: Must contain at least one uppercase letter and one number
          example: Password1
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: Jane
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Doe

    LoginBody:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 1
          example: Password1

    ForgotPasswordBody:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordBody:
      type: object
      required: [tokenHash, password]
      properties:
        tokenHash:
          type: string
          description: Raw reset token received via email (hashed server-side for lookup)
          example: 8f14e45fceea167a5a36dedd4bea2543
        password:
          type: string
          minLength: 8
          example: NewPassword1

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        email:
          type: string
          format: email
          example: user@example.com
        avatarUrl:
          type: string
          format: uri
          nullable: true
          example: https://cdn.example.com/avatars/123.png
        createdAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00.000Z"

    UpdateUserBody:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        avatarUrl:
          type: string
          format: uri

    ChangePasswordBody:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          example: Password1
        newPassword:
          type: string
          minLength: 8
          example: NewPassword1

    # ── Startups ──────────────────────────────────────────────────────
    FundingStage:
      type: string
      enum: [pre_seed, seed, series_a, series_b, series_c, growth, other]
      example: seed

    Startup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Acme Inc.
        description:
          type: string
          nullable: true
        industry:
          type: string
          nullable: true
          example: Fintech
        website:
          type: string
          format: uri
          nullable: true
        fundingStage:
          $ref: "#/components/schemas/FundingStage"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateStartupBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Acme Inc.
        description:
          type: string
        industry:
          type: string
          example: Fintech
        website:
          type: string
          format: uri
        fundingStage:
          $ref: "#/components/schemas/FundingStage"

    UpdateStartupBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        description:
          type: string
        industry:
          type: string
        website:
          type: string
          format: uri
        fundingStage:
          $ref: "#/components/schemas/FundingStage"

    # ── RBAC ──────────────────────────────────────────────────────────
    Permission:
      type: object
      properties:
        id:
          type: string
          format: uuid
        resource:
          type: string
          example: documents
        action:
          type: string
          example: delete
        description:
          type: string
          nullable: true

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        name:
          type: string
          example: Finance Lead
        description:
          type: string
          nullable: true
        isSystemRole:
          type: boolean
          example: false
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time

    CreateRoleBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: Finance Lead
        description:
          type: string
        permissionIds:
          type: array
          items:
            type: string
            format: uuid

    UpdateRoleBody:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        description:
          type: string

    SetRolePermissionsBody:
      type: object
      required: [permissionIds]
      properties:
        permissionIds:
          type: array
          items:
            type: string
            format: uuid
          description: Full replacement set of permission IDs for this role

    # ── Startup Members ───────────────────────────────────────────────
    MemberStatus:
      type: string
      enum: [invited, active, suspended]
      example: active

    StartupMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        invitedEmail:
          type: string
          format: email
          nullable: true
          description: Set when invited before the user has an account; cleared once accepted
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/MemberStatus"
        invitedBy:
          type: string
          format: uuid
          nullable: true
        joinedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    InviteMemberBody:
      type: object
      required: [email, roleId]
      properties:
        email:
          type: string
          format: email
          example: newmember@example.com
        roleId:
          type: string
          format: uuid

    UpdateMemberBody:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/MemberStatus"

    AcceptInviteBody:
      type: object
      required: [inviteTokenHash]
      properties:
        inviteTokenHash:
          type: string
          description: Raw invite token from the email link
          example: 7c6a180b36896a0a8c02787eeafb0e4c
        password:
          type: string
          minLength: 8
          description: Required only if the invited person does not yet have an account
          example: Password1
        firstName:
          type: string
          description: Required only if the invited person does not yet have an account
        lastName:
          type: string
          description: Required only if the invited person does not yet have an account

    # ── CRM: Investors ────────────────────────────────────────────────
    InvestorType:
      type: string
      enum: [vc, angel, family_office, accelerator, other]
      example: vc

    # An investor contact private to one startup. Contacts are never shared
    # between startups — two startups tracking the same person hold two
    # independent records.
    Investor:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        fullName:
          type: string
          example: John Smith
        email:
          type: string
          format: email
          nullable: true
          description: Optional — a contact can be added before an address is known.
        ventureFirm:
          type: string
          nullable: true
          example: Acme Ventures
        investorType:
          allOf:
            - $ref: "#/components/schemas/InvestorType"
          nullable: true
        sectorFocus:
          type: string
          nullable: true
          example: Fintech, SaaS
        investmentStagePreference:
          type: string
          nullable: true
          example: Seed, Series A
        linkedinUrl:
          type: string
          format: uri
          nullable: true
        notes:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
          example: event
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # A contact joined to its pipeline entry and next follow-up — the shape the
    # Investors screen renders.
    InvestorListItem:
      allOf:
        - $ref: "#/components/schemas/Investor"
        - type: object
          properties:
            pipeline:
              nullable: true
              description: Null when the contact has not been added to the pipeline.
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                stage:
                  $ref: "#/components/schemas/PipelineStage"
                expectedAmount:
                  type: number
                  format: double
                  nullable: true
                probabilityPercentage:
                  type: integer
                  nullable: true
            nextFollowupDate:
              type: string
              format: date-time
              nullable: true
              description: >
                Earliest upcoming nextFollowupDate across this contact's
                interaction logs; null when none is scheduled.

    CreateInvestorBody:
      type: object
      required: [fullName]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          description: Optional, but must be unique within the startup when given.
        ventureFirm:
          type: string
        investorType:
          $ref: "#/components/schemas/InvestorType"
        sectorFocus:
          type: string
        investmentStagePreference:
          type: string
        linkedinUrl:
          type: string
          format: uri
          description: Must use http or https.
        notes:
          type: string
        source:
          type: string

    UpdateInvestorBody:
      type: object
      description: All fields optional; at least one required.
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
        ventureFirm:
          type: string
        investorType:
          $ref: "#/components/schemas/InvestorType"
        sectorFocus:
          type: string
        investmentStagePreference:
          type: string
        linkedinUrl:
          type: string
          format: uri
        notes:
          type: string
        source:
          type: string

    # ── CRM: Pipeline ─────────────────────────────────────────────────
    PipelineStage:
      type: string
      enum: [sourced, contacted, meeting_scheduled, due_diligence, term_sheet, committed, passed]
      example: meeting_scheduled

    PipelineEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        investor:
          $ref: "#/components/schemas/Investor"
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
          nullable: true
          example: 250000
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          example: 60
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePipelineEntryBody:
      type: object
      required: [investorId, stage]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100

    UpdatePipelineEntryBody:
      type: object
      description: At least one field is required.
      properties:
        stage:
          $ref: "#/components/schemas/PipelineStage"
        expectedAmount:
          type: number
          format: double
          nullable: true
        probabilityPercentage:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true

    # ── CRM: Interaction Logs ─────────────────────────────────────────
    InteractionType:
      type: string
      enum: [call, email, meeting, note, other]
      example: meeting

    InteractionLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
          nullable: true
        createdBy:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        interactionDate:
          type: string
          format: date-time
        nextFollowupDate:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    CreateInteractionLogBody:
      type: object
      required: [investorId, type, interactionDate]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
        description:
          type: string
        interactionDate:
          type: string
          format: date-time
        nextFollowupDate:
          type: string
          format: date-time

    UpdateInteractionLogBody:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/InteractionType"
        subject:
          type: string
        description:
          type: string
        interactionDate:
          type: string
          format: date-time
        nextFollowupDate:
          type: string
          format: date-time

    # ── Financial: Fundraising Rounds ─────────────────────────────────
    RoundStatus:
      type: string
      enum: [draft, open, closed, cancelled]
      example: open

    FundraisingRound:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        roundName:
          type: string
          example: Seed Round
        targetAmount:
          type: number
          format: double
          example: 1500000
        minimumTicketSize:
          type: number
          format: double
          nullable: true
          example: 25000
        equityOfferedPercentage:
          type: number
          format: double
          nullable: true
          example: 12.5
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/RoundStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFundraisingRoundBody:
      type: object
      required: [roundName, targetAmount, currency]
      properties:
        roundName:
          type: string
          minLength: 2
          maxLength: 150
        targetAmount:
          type: number
          format: double
          minimum: 0
        minimumTicketSize:
          type: number
          format: double
          minimum: 0
        equityOfferedPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        currency:
          type: string
          example: USD
        status:
          $ref: "#/components/schemas/RoundStatus"

    UpdateFundraisingRoundBody:
      type: object
      properties:
        roundName:
          type: string
          minLength: 2
          maxLength: 150
        targetAmount:
          type: number
          format: double
          minimum: 0
        minimumTicketSize:
          type: number
          format: double
          minimum: 0
        equityOfferedPercentage:
          type: number
          format: double
          minimum: 0
          maximum: 100
        currency:
          type: string
        status:
          $ref: "#/components/schemas/RoundStatus"

    # ── Financial: Commitments ────────────────────────────────────────
    CommitmentStatus:
      type: string
      enum: [pending, negotiating, confirmed, funded, withdrawn]
      example: pending

    Commitment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        investor:
          $ref: "#/components/schemas/Investor"
        pipelineId:
          type: string
          format: uuid
          nullable: true
        roundId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          example: 50000
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateCommitmentBody:
      type: object
      required: [investorId, roundId, amount]
      properties:
        investorId:
          type: string
          format: uuid
          description: The investor contact id (a startup-scoped contact record).
        pipelineId:
          type: string
          format: uuid
        roundId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date

    UpdateCommitmentBody:
      type: object
      properties:
        amount:
          type: number
          format: double
          minimum: 0
        status:
          $ref: "#/components/schemas/CommitmentStatus"
        expectedCloseDate:
          type: string
          format: date

    # ── Documents ───────────────────────────────────────────────────
    DocumentType:
      type: string
      enum: [pitch_deck, financial_model, cap_table, term_sheet, data_room, other]
      example: pitch_deck

    Document:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        title:
          type: string
          example: Series A Pitch Deck
        documentType:
          $ref: "#/components/schemas/DocumentType"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateDocumentBody:
      type: object
      required: [title, documentType]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"

    UpdateDocumentBody:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        documentType:
          $ref: "#/components/schemas/DocumentType"

    DocumentVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        versionNumber:
          type: integer
          example: 3
        isCurrent:
          type: boolean
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          description: File size in bytes
          example: 2485760
        summary:
          type: string
          nullable: true
          description: Description of what changed in this version
        uploadedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateDocumentVersionBody:
      type: object
      required: [fileUrl, fileSize]
      properties:
        fileUrl:
          type: string
          format: uri
        fileSize:
          type: integer
          minimum: 0
        summary:
          type: string

    # ── Reviewer ──────────────────────────────────────────────────────
    ReviewerInvitationStatus:
      type: string
      enum: [pending, accessed, expired, revoked]
      example: pending

    ReviewerInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        investorId:
          type: string
          format: uuid
          nullable: true
          description: Set when the reviewer is a known investor from the CRM
        email:
          type: string
          format: email
        status:
          $ref: "#/components/schemas/ReviewerInvitationStatus"
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          description: Documents this invitation grants access to
        expiresAt:
          type: string
          format: date-time
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    CreateReviewerInvitationBody:
      type: object
      required: [email, documentIds]
      properties:
        email:
          type: string
          format: email
        investorId:
          type: string
          format: uuid
          description: Optional — link to an existing CRM investor record
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        expiresAt:
          type: string
          format: date-time
          description: Defaults to 14 days from creation if omitted

    UpdateReviewerInvitationBody:
      type: object
      properties:
        documentIds:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
        expiresAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [revoked]
          description: Owners may only transition status to "revoked" via this endpoint

    # ── Reviewer Portal (public, token + OTP) ──────────────────────────
    ReviewerPortalAccessBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Raw invitation token from the emailed link
          example: 3a7bd3e2360a3d29eea436fcfb7e44542f4e4cd2e3e4a3c

    ReviewerPortalVerifyBody:
      type: object
      required: [token, code]
      properties:
        token:
          type: string
          example: 3a7bd3e2360a3d29eea436fcfb7e44542f4e4cd2e3e4a3c
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: 6-digit OTP code emailed to the invitation address
          example: "482913"

    ReviewerPortalSession:
      type: object
      properties:
        invitation:
          $ref: "#/components/schemas/ReviewerInvitation"
        startup:
          $ref: "#/components/schemas/Startup"
        documents:
          type: array
          items:
            $ref: "#/components/schemas/Document"

    # ── Reviewer Comments ─────────────────────────────────────────────
    ReviewerComment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        invitationId:
          type: string
          format: uuid
        startupId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
          nullable: true
        chunkId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
        createdAt:
          type: string
          format: date-time

    CreateReviewerCommentBody:
      type: object
      required: [commentText]
      properties:
        documentId:
          type: string
          format: uuid
          nullable: true
        chunkId:
          type: string
          format: uuid
          nullable: true
        commentText:
          type: string
          minLength: 1

# ─── Paths ─────────────────────────────────────────────────────────────────────
paths:
  # ════════════════════════════════════════════════════════════════
  #  AUTH
  # ════════════════════════════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive auth cookies
      operationId: login
      description: >
        On success, sets two HttpOnly cookies: `accessToken` (15 min) and
        `refreshToken` (7 days). Include `credentials: "include"` in fetch calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh the access token
      operationId: refreshToken
      description: Reads the `refreshToken` cookie and issues new auth cookies.
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid refresh token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout and clear auth cookies
      operationId: logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current authenticated user
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password reset email
      operationId: forgotPassword
      description: >
        Always returns 200 regardless of whether the email exists, to avoid
        leaking which addresses are registered. If found, an email is sent
        with a single-use token (10-minute family rotation tracked server-side).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset email sent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using a token from the reset email
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Token expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  USERS (current user profile)
  # ════════════════════════════════════════════════════════════════
  /users/me:
    patch:
      tags: [Users]
      summary: Update the current user's profile
      operationId: updateMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  STARTUPS
  # ════════════════════════════════════════════════════════════════
  /startups:
    get:
      tags: [Startups]
      summary: List startups the current user belongs to
      operationId: listStartups
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of startups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Startup"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Startups]
      summary: Create a new startup
      operationId: createStartup
      description: The creator automatically becomes a member with the default "Owner" system role.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStartupBody"
      responses:
        "201":
          description: Startup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startups/{startupId}:
    parameters:
      - name: startupId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Startups]
      summary: Get a startup by ID
      operationId: getStartup
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Startup details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Startups]
      summary: Update a startup
      operationId: updateStartup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStartupBody"
      responses:
        "200":
          description: Startup updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Startup"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Startups]
      summary: Delete a startup
      operationId: deleteStartup
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Startup deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Startup not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/me/password:
    patch:
      tags: [Users]
      summary: Change the current user's password
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized or current password incorrect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  STARTUP MEMBERS
  # ════════════════════════════════════════════════════════════════
  /startup-members:
    get:
      tags: [Startup Members]
      summary: List members of the current startup
      operationId: listStartupMembers
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MemberStatus"
      responses:
        "200":
          description: List of startup members
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/StartupMember"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /startup-members/invite:
    post:
      tags: [Startup Members]
      summary: Invite a person to join the current startup
      operationId: inviteStartupMember
      description: >
        Creates a member record with status "invited". If the email does not
        match an existing user, `invitedEmail` is set and `userId` remains null
        until the invite is accepted. Sends an email with a time-limited invite link.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberBody"
      responses:
        "201":
          description: >
            Invitation created. `emailQueued` is false if the invite record was
            created but the notification email could not be queued (e.g. Redis
            outage) — the caller should tell the inviter to resend or notify the
            person directly.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  emailQueued:
                    type: boolean
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Person is already a member or has a pending invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startup-members/accept-invite:
    post:
      tags: [Startup Members]
      summary: Accept a startup membership invitation
      operationId: acceptStartupInvite
      description: >
        Public endpoint (no cookieAuth required). If the invited person has no
        account yet, `firstName`, `lastName`, and `password` must be provided to
        create one. On success the member status becomes "active" and auth
        cookies are set, logging the person in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInviteBody"
      responses:
        "200":
          description: Invitation accepted
          headers:
            Set-Cookie:
              schema:
                type: string
                example: accessToken=...; HttpOnly; Path=/api
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user:
                        $ref: "#/components/schemas/User"
                      member:
                        $ref: "#/components/schemas/StartupMember"
        "400":
          description: Invite token expired or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /startup-members/{memberId}:
    parameters:
      - name: memberId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Startup Members]
      summary: Update a member's role or status
      operationId: updateStartupMember
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberBody"
      responses:
        "200":
          description: Member updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/StartupMember"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Startup Members]
      summary: Remove a member from the startup
      operationId: removeStartupMember
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  ROLES (RBAC)
  # ════════════════════════════════════════════════════════════════
  /roles:
    get:
      tags: [Roles]
      summary: List roles for the current startup
      operationId: listRoles
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Roles]
      summary: Create a custom role
      operationId: createRole
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleBody"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A role with this name already exists for this startup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Roles]
      summary: Get a role by ID
      operationId: getRole
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Roles]
      summary: Update a role's name or description
      operationId: updateRole
      description: System roles cannot be renamed; returns 403 if attempted.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleBody"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions or attempting to modify a system role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
    delete:
      tags: [Roles]
      summary: Delete a custom role
      operationId: deleteRole
      description: System roles cannot be deleted; returns 403 if attempted.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions or attempting to delete a system role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Role is still assigned to one or more members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /roles/{roleId}/permissions:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Roles]
      summary: Replace the full set of permissions assigned to a role
      operationId: setRolePermissions
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRolePermissionsBody"
      responses:
        "200":
          description: Permissions updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Role"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Role not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  # ════════════════════════════════════════════════════════════════
  #  PERMISSIONS (RBAC catalog — global, read-only)
  # ════════════════════════════════════════════════════════════════
  /permissions:
    get:
      tags: [Permissions]
      summary: List all available permissions in the system
      operationId: listPermissions
      description: Global, non-tenant-scoped catalog used when building or editing roles.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                properties:
