      tags: [Reviewer Comments]
      summary: List comments left under a specific reviewer invitation
      operationId: listReviewerInvitationComments
      description: Owner-side view of feedback left by an external reviewer.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of reviewer comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReviewerComment"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
