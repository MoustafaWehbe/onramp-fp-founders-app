  # ════════════════════════════════════════════════════════════════
  #  DOCUMENT VERSIONS
  # ════════════════════════════════════════════════════════════════
  /documents/{documentId}/versions:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Document Versions]
      summary: List all versions of a document
      operationId: listDocumentVersions
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: List of document versions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocumentVersion"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Document Versions]
      summary: Upload a new version of a document
      operationId: createDocumentVersion
      description: >
        Creates a new version and sets it as the document's current version (`isCurrent = true`).
        `fileUrl` should point to the already-uploaded file in object storage.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentVersionBody"
      responses:
        "201":
          description: Document version created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DocumentVersion"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"

  /documents/{documentId}/versions/{versionId}:
    parameters:
      - name: documentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: versionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Document Versions]
      summary: Get a specific document version
      operationId: getDocumentVersion
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Document version details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/DocumentVersion"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Document Versions]
      summary: Delete a specific document version
      operationId: deleteDocumentVersion
      description: >
        Cannot delete the version currently marked with `isCurrent = true` unless it
        is the document's only version (in which case the document is also deleted).
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Document version deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Document or version not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Cannot delete the current version while other versions exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

